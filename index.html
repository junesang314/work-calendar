<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스케줄 근무 및 일정 관리</title>

  <!-- 앱 아이콘 및 파비콘 설정 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" href="icon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20 sm:pb-6 select-none overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 한국 공휴일 데이터 ---
    const HOLIDAYS_DATA = {
      "01-01": "신정",
      "03-01": "삼일절",
      "05-05": "어린이날",
      "06-06": "현충일",
      "08-15": "광복절",
      "10-03": "개천절",
      "10-09": "한글날",
      "12-25": "성탄절",
      "2024-02-09": "설날 연휴", "2024-02-10": "설날", "2024-02-11": "설날 연휴", "2024-02-12": "대체공휴일",
      "2024-05-15": "부처님오신날",
      "2024-09-16": "추석 연휴", "2024-09-17": "추석", "2024-09-18": "추석 연휴",
      "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴",
      "2025-05-05": "부처님오신날", "2025-05-06": "대체공휴일",
      "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일",
      "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
      "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일",
      "2027-05-13": "부처님오신날",
      "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴"
    };

    function getHolidayName(dateStr) {
      if (HOLIDAYS_DATA[dateStr]) return HOLIDAYS_DATA[dateStr];
      const mmdd = dateStr.substring(5);
      if (HOLIDAYS_DATA[mmdd]) return HOLIDAYS_DATA[mmdd];
      return null;
    }

    const SHIFT_TYPES = ['주간', '당직', '비번'];

    function calculateAutoShift(dateStr, settings) {
      const anchor = new Date(settings.anchorDate + 'T00:00:00');
      const target = new Date(dateStr + 'T00:00:00');

      const diffDays = Math.round((target - anchor) / (1000 * 60 * 60 * 24));
      const anchorIdx = SHIFT_TYPES.indexOf(settings.anchorShift);
      
      let rawIdx = (anchorIdx + diffDays) % 3;
      if (rawIdx < 0) rawIdx = (rawIdx + 3) % 3;

      const rawShift = SHIFT_TYPES[rawIdx];

      const dayOfWeek = target.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const holidayName = getHolidayName(dateStr);
      const isHoliday = !!holidayName;

      if (rawShift === '주간' && (isWeekend || isHoliday)) {
        return {
          shift: '비번',
          isRuleModified: true,
          originalShift: '주간',
          reason: isWeekend ? '주말 휴일' : holidayName
        };
      }

      return {
        shift: rawShift,
        isRuleModified: false,
        originalShift: rawShift
      };
    }

    function App() {
      const today = new Date();
      // 뷰 모드: 'monthly' | 'weekly' | 'yearly'
      const [viewMode, setViewMode] = useState('monthly');
      const [currentDate, setCurrentDate] = useState(new Date());

      // 3패널 스와이프 캐러셀 상태
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [isAnimating, setIsAnimating] = useState(false);
      const pendingDirectionRef = useRef(0); // -1: 다음, 1: 이전

      const touchStartRef = useRef({ x: 0, y: 0, time: 0 });
      const containerRef = useRef(null);

      // 롱프레스 간략 팝업 상태
      const [previewDayInfo, setPreviewDayInfo] = useState(null);
      const longPressTimerRef = useRef(null);
      const isLongPressedRef = useRef(false);

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('shift_app_settings');
        return saved ? JSON.parse(saved) : { anchorDate: '2026-09-01', anchorShift: '당직' };
      });

      const [overrides, setOverrides] = useState(() => {
        const saved = localStorage.getItem('shift_app_overrides');
        return saved ? JSON.parse(saved) : {};
      });

      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('shift_app_events');
        return saved ? JSON.parse(saved) : {};
      });

      // 운동 기록 상태 ({ "YYYY-MM-DD": true })
      const [workouts, setWorkouts] = useState(() => {
        const saved = localStorage.getItem('shift_app_workouts');
        return saved ? JSON.parse(saved) : {};
      });

      const [selectedDateStr, setSelectedDateStr] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('shift_app_settings', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem('shift_app_overrides', JSON.stringify(overrides));
      }, [overrides]);

      useEffect(() => {
        localStorage.setItem('shift_app_events', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('shift_app_workouts', JSON.stringify(workouts));
      }, [workouts]);

      // 운동 토글 함수
      const toggleWorkout = (dateStr) => {
        setWorkouts(prev => {
          const next = { ...prev };
          if (next[dateStr]) {
            delete next[dateStr];
          } else {
            next[dateStr] = true;
          }
          return next;
        });
      };

      const getRelativeDate = (baseDate, offset) => {
        const d = new Date(baseDate);
        if (viewMode === 'yearly') {
          d.setFullYear(d.getFullYear() + offset);
        } else if (viewMode === 'monthly') {
          d.setMonth(d.getMonth() + offset);
        } else if (viewMode === 'weekly') {
          d.setDate(d.getDate() + (offset * 7));
        }
        return d;
      };

      const prevDate = useMemo(() => getRelativeDate(currentDate, -1), [currentDate, viewMode]);
      const currDate = currentDate;
      const nextDate = useMemo(() => getRelativeDate(currentDate, 1), [currentDate, viewMode]);

      const triggerPageChange = (dir) => {
        if (isAnimating) return;
        const containerWidth = containerRef.current ? containerRef.current.clientWidth : window.innerWidth;
        pendingDirectionRef.current = dir;
        setIsAnimating(true);
        setDragX(dir === -1 ? -containerWidth : containerWidth);
      };

      const handlePrev = () => triggerPageChange(1);
      const handleNext = () => triggerPageChange(-1);

      const goToday = () => {
        setCurrentDate(new Date());
        setDragX(0);
      };

      const handleTouchStart = (e) => {
        if (isAnimating) return;
        touchStartRef.current = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY,
          time: Date.now()
        };
        setIsDragging(true);
        setIsAnimating(false);
      };

      const handleTouchMove = (e) => {
        if (!isDragging) return;

        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;

        const deltaX = currentX - touchStartRef.current.x;
        const deltaY = currentY - touchStartRef.current.y;

        if (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8) {
          if (longPressTimerRef.current) {
            clearTimeout(longPressTimerRef.current);
            longPressTimerRef.current = null;
          }
        }

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          setDragX(deltaX);
        }
      };

      const handleTouchEnd = () => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }

        if (!isDragging) return;
        setIsDragging(false);

        const duration = Date.now() - touchStartRef.current.time;
        const velocity = Math.abs(dragX) / duration;
        const containerWidth = containerRef.current ? containerRef.current.clientWidth : window.innerWidth;

        if (dragX < -60 || (dragX < -25 && velocity > 0.25)) {
          pendingDirectionRef.current = -1;
          setIsAnimating(true);
          setDragX(-containerWidth);
        } else if (dragX > 60 || (dragX > 25 && velocity > 0.25)) {
          pendingDirectionRef.current = 1;
          setIsAnimating(true);
          setDragX(containerWidth);
        } else {
          pendingDirectionRef.current = 0;
          setIsAnimating(true);
          setDragX(0);
        }
      };

      const handleTransitionEnd = () => {
        if (!isAnimating) return;

        const dir = pendingDirectionRef.current;
        if (dir !== 0) {
          setCurrentDate(prev => getRelativeDate(prev, dir === -1 ? 1 : -1));
        }

        setIsAnimating(false);
        setDragX(0);
        pendingDirectionRef.current = 0;
      };

      const handleCellTouchStart = (day) => {
        isLongPressedRef.current = false;
        longPressTimerRef.current = setTimeout(() => {
          isLongPressedRef.current = true;
          setPreviewDayInfo(day);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 450);
      };

      const handleCellTouchEnd = () => {
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }
      };

      const handleCellClick = (day) => {
        if (isLongPressedRef.current) {
          isLongPressedRef.current = false;
          return;
        }
        setSelectedDateStr(day.dateStr);
      };

      const getDayInfo = (d) => {
        const yearStr = d.getFullYear();
        const monthStr = String(d.getMonth() + 1).padStart(2, '0');
        const dayStr = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yearStr}-${monthStr}-${dayStr}`;

        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const dayOfWeek = d.getDay();
        const holidayName = getHolidayName(dateStr);
        const isWorkout = !!workouts[dateStr];

        let shiftInfo;
        if (overrides[dateStr]) {
          shiftInfo = { shift: overrides[dateStr], isOverride: true, isRuleModified: false };
        } else {
          const auto = calculateAutoShift(dateStr, settings);
          shiftInfo = { shift: auto.shift, isOverride: false, isRuleModified: auto.isRuleModified, reason: auto.reason };
        }

        return {
          dateObj: new Date(d),
          dateStr,
          dayNum: d.getDate(),
          dayOfWeek,
          isToday,
          holidayName,
          shiftInfo,
          isWorkout,
          dayEvents: events[dateStr] || []
        };
      };

      const getMonthlyDays = (targetDate) => {
        const y = targetDate.getFullYear();
        const m = targetDate.getMonth();
        const firstDay = new Date(y, m, 1);
        const lastDay = new Date(y, m + 1, 0);

        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - startDate.getDay());

        const endDate = new Date(lastDay);
        if (endDate.getDay() !== 6) {
          endDate.setDate(endDate.getDate() + (6 - endDate.getDay()));
        }

        const days = [];
        let curr = new Date(startDate);

        while (curr <= endDate) {
          const info = getDayInfo(curr);
          info.isCurrentMonth = curr.getMonth() === m;
          days.push(info);
          curr.setDate(curr.getDate() + 1);
        }

        return days;
      };

      const getWeeklyDays = (targetDate) => {
        const startOfWeek = new Date(targetDate);
        startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

        const days = [];
        let curr = new Date(startOfWeek);

        for (let i = 0; i < 7; i++) {
          const info = getDayInfo(curr);
          info.isCurrentMonth = true;
          days.push(info);
          curr.setDate(curr.getDate() + 1);
        }

        return days;
      };

      const currMonthlyDays = useMemo(() => getMonthlyDays(currDate), [currDate, settings, overrides, events, workouts]);

      const monthSummary = useMemo(() => {
        const summary = { 당직: 0, 주간: 0, 비번: 0, 연차: 0, 운동: 0 };
        currMonthlyDays.forEach(day => {
          if (day.isCurrentMonth) {
            const s = day.shiftInfo.shift;
            if (summary[s] !== undefined) summary[s]++;
            if (day.isWorkout) summary.운동++;
          }
        });
        return summary;
      }, [currMonthlyDays]);

      const weekRangeText = useMemo(() => {
        const days = getWeeklyDays(currDate);
        if (days.length === 0) return '';
        const start = days[0].dateStr;
        const end = days[6].dateStr;
        return `${start.replace(/-/g, '.')} ~ ${end.substring(5).replace(/-/g, '.')}`;
      }, [currDate, settings, overrides, events, workouts]);

      const toggleYearlyView = () => {
        setViewMode(prev => (prev === 'yearly' ? 'monthly' : 'yearly'));
        setDragX(0);
      };

      const renderViewContent = (targetDate) => {
        if (viewMode === 'monthly') {
          const days = getMonthlyDays(targetDate);
          return (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="grid grid-cols-7 border-b border-slate-200 text-center bg-slate-50/70 font-semibold text-xs py-3 text-slate-600">
                <div className="text-red-500">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div className="text-blue-500">토</div>
              </div>

              <div className="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-100">
                {days.map((day, idx) => {
                  const isSunday = day.dayOfWeek === 0;
                  const isSaturday = day.dayOfWeek === 6;
                  const isHoliday = !!day.holidayName;

                  let dateNumColor = "text-slate-800";
                  if (!day.isCurrentMonth) {
                    dateNumColor = "text-slate-300";
                  } else if (isSunday || isHoliday) {
                    dateNumColor = "text-red-500";
                  } else if (isSaturday) {
                    dateNumColor = "text-blue-500";
                  }

                  // 칸 배경색: 운동 완료 시 산뜻한 초록색 칸으로 확 변경!
                  let cellBgStyle = !day.isCurrentMonth 
                    ? "bg-slate-50/40" 
                    : day.isWorkout 
                    ? "bg-emerald-100/75 border-emerald-300/80" 
                    : "bg-white";

                  return (
                    <div
                      key={idx}
                      onTouchStart={() => handleCellTouchStart(day)}
                      onTouchEnd={handleCellTouchEnd}
                      onMouseDown={() => handleCellTouchStart(day)}
                      onMouseUp={handleCellTouchEnd}
                      onClick={() => handleCellClick(day)}
                      className={`min-h-[150px] p-2 transition cursor-pointer flex flex-col justify-between group hover:brightness-95 active:scale-[0.99] ${cellBgStyle} ${
                        day.isToday ? "ring-2 ring-blue-500 ring-inset z-10" : ""
                      }`}
                    >
                      <div>
                        <div className="flex items-start justify-between">
                          <span className={`text-sm font-bold ${dateNumColor}`}>
                            {day.dayNum}
                          </span>
                          {/* 운동 완료 시 날짜 옆 미니 덤벨/러닝 배지 */}
                          {day.isWorkout && day.isCurrentMonth && (
                            <span className="text-[11px] bg-emerald-600 text-white rounded-md px-1 py-0.2 font-bold shadow-xs">
                              🏃
                            </span>
                          )}
                        </div>

                        {day.holidayName && day.isCurrentMonth && (
                          <div className="text-[10px] font-semibold text-red-500 truncate leading-tight mt-0.5">
                            {day.holidayName}
                          </div>
                        )}
                      </div>

                      <div className="my-2 flex flex-col items-center justify-center">
                        <ShiftBadge info={day.shiftInfo} />
                      </div>

                      {/* 등록된 일정 목록 */}
                      <div className="space-y-1 mt-auto max-h-[65px] overflow-y-auto custom-scrollbar pr-0.5">
                        {day.dayEvents.map((evt) => (
                          <div
                            key={evt.id}
                            className={`text-[10px] px-1.5 py-1 rounded-md truncate font-semibold flex items-center justify-between shadow-2xs border ${
                              day.isWorkout 
                                ? "bg-white/90 text-emerald-900 border-emerald-300" 
                                : "bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border-emerald-200/80"
                            }`}
                          >
                            <span className="truncate">{evt.title}</span>
                            {evt.time && <span className="text-[9px] text-emerald-600 pl-1 shrink-0">{evt.time}</span>}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        if (viewMode === 'weekly') {
          const days = getWeeklyDays(targetDate);
          return (
            <div className="space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-7 gap-3">
                {days.map((day, idx) => {
                  const isSunday = day.dayOfWeek === 0;
                  const isSaturday = day.dayOfWeek === 6;
                  const isHoliday = !!day.holidayName;
                  const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

                  let headerBg = "bg-slate-50 text-slate-700";
                  let dateNumColor = "text-slate-800";

                  if (day.isToday) {
                    headerBg = "bg-blue-600 text-white";
                    dateNumColor = "text-white";
                  } else if (isSunday || isHoliday) {
                    dateNumColor = "text-red-500";
                  } else if (isSaturday) {
                    dateNumColor = "text-blue-500";
                  }

                  const shift = day.shiftInfo.shift;
                  let shiftBoxStyle = "bg-white border-slate-200";
                  let shiftLabelStyle = "text-slate-600 font-medium";

                  if (shift === '주간') {
                    shiftBoxStyle = "bg-amber-100/90 border-amber-300";
                    shiftLabelStyle = "text-amber-950 font-bold";
                  } else if (shift === '당직') {
                    shiftBoxStyle = "bg-blue-100/90 border-blue-300";
                    shiftLabelStyle = "text-blue-950 font-bold";
                  } else if (shift === '비번') {
                    shiftBoxStyle = "bg-rose-100/80 border-rose-200";
                    shiftLabelStyle = "text-rose-900 font-bold";
                  } else {
                    shiftBoxStyle = "bg-emerald-100/90 border-emerald-300";
                    shiftLabelStyle = "text-emerald-950 font-bold";
                  }

                  return (
                    <div
                      key={idx}
                      className={`bg-white rounded-2xl shadow-sm border transition flex flex-col justify-between overflow-hidden ${
                        day.isWorkout ? "ring-2 ring-emerald-400 border-emerald-400 bg-emerald-50/30" : ""
                      } ${day.isToday ? "ring-2 ring-blue-500 border-blue-500" : "border-slate-200"}`}
                    >
                      <div className={`p-3 border-b flex items-center justify-between ${headerBg}`}>
                        <div>
                          <div className="text-xs font-semibold opacity-90">{dayNames[day.dayOfWeek]}</div>
                          <div className={`text-lg font-bold leading-none ${dateNumColor}`}>
                            {day.dateStr.substring(5).replace('-', '.')}
                          </div>
                        </div>
                        <div className="flex items-center space-x-1.5">
                          {day.isWorkout && (
                            <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-emerald-600 text-white flex items-center space-x-0.5 shadow-xs">
                              <span>🏃 운동완료</span>
                            </span>
                          )}
                          {day.holidayName && (
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${day.isToday ? 'bg-red-500 text-white' : 'bg-red-100 text-red-600'}`}>
                              {day.holidayName}
                            </span>
                          )}
                        </div>
                      </div>

                      <div className="p-3 flex-1 flex flex-col justify-between space-y-3">
                        <div className={`flex items-center justify-between p-2.5 rounded-xl border transition ${shiftBoxStyle}`}>
                          <span className={`text-xs ${shiftLabelStyle}`}>오늘의 근무</span>
                          <ShiftBadge info={day.shiftInfo} />
                        </div>

                        {/* 위클리 일정 목록 */}
                        <div className="space-y-1.5 flex-1 min-h-[100px]">
                          <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center justify-between">
                            <span>일정 ({day.dayEvents.length})</span>
                          </div>

                          {day.dayEvents.length > 0 ? (
                            day.dayEvents.map((evt) => (
                              <div
                                key={evt.id}
                                className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-900 p-2.5 rounded-xl border border-emerald-200/80 space-y-0.5 shadow-2xs"
                              >
                                <div className="font-bold flex items-center justify-between">

          {/* 3패널 연속 트랙 캐러셀 */}

            className="overflow-hidden w-full relative touch-pan-y"

              style={{

              }}

              <div className="w-1/3 shrink-0 px-0.5">

              <div className="w-1/3 shrink-0 px-0.5">

                {renderViewContent(nextDate)}
              </div>
            </div>
          </div>

          {/* 모바일 하단 내비게이션 바 */}
          <div className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 py-2.5 px-6 sm:hidden z-40 flex items-center justify-around shadow-lg">

              onClick={() => { setViewMode('monthly'); setDragX(0); }}
              className={`flex flex-col items-center space-y-1 ${viewMode === 'monthly' ? 'text-blue-600 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-regular fa-calendar-days text-base"></i>
              <span className="text-[10px]">월간 달력</span>
            </button>
            <button
              onClick={() => { setViewMode('weekly'); setDragX(0); }}
              className={`flex flex-col items-center space-y-1 ${viewMode === 'weekly' ? 'text-blue-600 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-solid fa-list-check text-base"></i>
              <span className="text-[10px]">위클리 스케줄</span>
            </button>
            <button
              onClick={() => setIsSettingsOpen(true)}
              className="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-700"
            >
              <i className="fa-solid fa-gear text-base"></i>
              <span className="text-[10px]">패턴 설정</span>
            </button>
          </div>

          <div className="mt-4 bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-xs text-slate-500 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center space-x-4">
              <span className="font-semibold text-slate-700">근무 범례:</span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-blue-600 rounded-full inline-block"></span><span>당직</span></span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-amber-400 rounded-full inline-block"></span><span>주간</span></span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-rose-50 border border-rose-200 text-rose-600 font-bold text-[9px] rounded-full flex items-center justify-center inline-block">비</span><span>비번</span></span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-emerald-100 border border-emerald-400 rounded-md inline-flex items-center justify-center text-[9px]">🏃</span><span>운동 완료 칸</span></span>
            </div>
            <div className="text-slate-400 text-[11px]">
              * 날짜를 터치하여 운동을 체크하면 먼슬리 칸 색상이 초록색으로 변경됩니다.
            </div>
          </div>

          {/* 롱프레스 간략 팝업 모달 */}
          {previewDayInfo && (
            <QuickPreviewPopup
              dayInfo={previewDayInfo}
              isWorkout={!!workouts[previewDayInfo.dateStr]}
              onToggleWorkout={() => toggleWorkout(previewDayInfo.dateStr)}
              onClose={() => setPreviewDayInfo(null)}
              onOpenDetail={() => {
                setSelectedDateStr(previewDayInfo.dateStr);
                setPreviewDayInfo(null);
              }}
            />
          )}

          {/* 상세 일정/근무 수정 모달 */}
          {selectedDateStr && (
            <DateDetailModal
              dateStr={selectedDateStr}
              isWorkout={!!workouts[selectedDateStr]}
              onToggleWorkout={() => toggleWorkout(selectedDateStr)}
              onClose={() => setSelectedDateStr(null)}
              settings={settings}
              overrideShift={overrides[selectedDateStr]}
              onSetOverride={(shift) => {
                if (shift === null) {
                  const copy = { ...overrides };
                  delete copy[selectedDateStr];
                  setOverrides(copy);
                } else {
                  setOverrides({ ...overrides, [selectedDateStr]: shift });
                }
              }}
              events={events[selectedDateStr] || []}
              onAddEvent={(newEvent) => {
                const list = events[selectedDateStr] || [];
                setEvents({ ...events, [selectedDateStr]: [...list, newEvent] });
              }}
              onDeleteEvent={(eventId) => {
                const list = events[selectedDateStr] || [];
                setEvents({
                  ...events,
                  [selectedDateStr]: list.filter((e) => e.id !== eventId)
                });
              }}
            />
          )}

          {isSettingsOpen && (
            <SettingsModal
              settings={settings}
              onSave={(newSettings) => {
                setSettings(newSettings);
                setIsSettingsOpen(false);
              }}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    function ShiftBadge({ info }) {
      const { shift, isOverride } = info;

      if (shift === '당직') {
        return (
          <div className="relative group">
            <span className="w-7 h-7 bg-blue-600 text-white rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
              당
            </span>
            {isOverride && (
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 border-2 border-white rounded-full" title="수동 수정됨"></span>
            )}
          </div>
        );
      }

      if (shift === '주간') {
        return (
          <div className="relative group">
            <span className="w-7 h-7 bg-amber-400 text-slate-900 rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
              주
            </span>
            {isOverride && (
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-blue-600 border-2 border-white rounded-full" title="수동 수정됨"></span>
            )}
          </div>
        );
      }

      if (shift === '비번') {
        return (
          <div className="relative group">
            <span className="w-7 h-7 bg-rose-50 text-rose-600 border border-rose-200 rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
              비
            </span>
            {isOverride && (
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 border-2 border-white rounded-full" title="수동 수정됨"></span>
            )}
          </div>
        );
      }

      return (
        <span className="w-7 h-7 bg-emerald-600 text-white rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
          {shift.substring(0, 1)}
        </span>
      );
    }

    // --- 롱프레스 간략 팝업 컴포넌트 ---
    function QuickPreviewPopup({ dayInfo, isWorkout, onToggleWorkout, onClose, onOpenDetail }) {
      const { dateStr, holidayName, shiftInfo, dayEvents, dayOfWeek } = dayInfo;
      const dayOfWeekKorean = ['일', '월', '화', '수', '목', '금', '토'][dayOfWeek];

      const shift = shiftInfo.shift;
      let badgeColor = "bg-slate-800 text-white";
      if (shift === '당직') badgeColor = "bg-blue-600 text-white";
      if (shift === '주간') badgeColor = "bg-amber-400 text-slate-900";
      if (shift === '비번') badgeColor = "bg-rose-500 text-white";

      return (
        <div 
          onClick={onClose}
          className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-in fade-in duration-150"
        >
          <div 
            onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-2xl shadow-2xl max-w-xs w-full overflow-hidden border border-slate-100 p-4 space-y-3.5 transform transition-all scale-100 animate-in zoom-in-95 duration-150"
          >
            <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
              <div>
                <div className="flex items-center space-x-1.5">
                  <h4 className="text-base font-bold text-slate-800">{dateStr} ({dayOfWeekKorean})</h4>
                  {holidayName && (
                    <span className="text-[10px] font-bold bg-red-500 text-white px-1.5 py-0.5 rounded-full">{holidayName}</span>
                  )}
                </div>
                <div className="text-[11px] text-slate-400 mt-0.5 flex items-center space-x-1.5">
                  <span>근무:</span>
                  <span className={`px-2 py-0.5 rounded-md font-bold text-xs ${badgeColor}`}>{shift}</span>
                </div>
              </div>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
                <i className="fa-solid fa-xmark text-base"></i>
              </button>
            </div>

            {/* 원터치 운동 완료 체크 버튼 */}
            <button
              type="button"
              onClick={onToggleWorkout}
              className={`w-full py-2 px-3 text-xs font-bold rounded-xl transition flex items-center justify-between border shadow-2xs ${
                isWorkout
                  ? 'bg-emerald-600 text-white border-emerald-600'
                  : 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100'
              }`}
            >
              <div className="flex items-center space-x-1.5">
                <span className="text-sm">🏃</span>
                <span>{isWorkout ? '운동 완료 기록됨' : '오늘 운동 기록하기'}</span>
              </div>
              <span className={`text-[10px] px-2 py-0.5 rounded-md font-bold ${isWorkout ? 'bg-white text-emerald-700' : 'bg-emerald-200/70 text-emerald-900'}`}>
                {isWorkout ? '완료 ✓' : '체크하기'}
              </span>
            </button>

            <div className="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
              <div className="text-xs font-bold text-slate-500 flex items-center justify-between">
                <span>등록된 일정 ({dayEvents.length})</span>

              {dayEvents.length > 0 ? (
                dayEvents.map((evt) => (
                  <div key={evt.id} className="p-2.5 bg-emerald-50/80 border border-emerald-200/80 rounded-xl space-y-0.5">
                    <div className="font-bold text-xs text-emerald-950 flex items-center justify-between">

            <div className="pt-1 flex space-x-2">

    function DateDetailModal({
      dateStr,
      isWorkout,
      onToggleWorkout,
      onClose,
      settings,
      overrideShift,
      onSetOverride,
      events,
      onAddEvent,
      onDeleteEvent
    }) {
      const autoCalculated = calculateAutoShift(dateStr, settings);
      const currentShift = overrideShift || autoCalculated.shift;
      const isManual = !!overrideShift;

      const [title, setTitle] = useState('');
      const [time, setTime] = useState('');
      const [note, setNote] = useState('');

      const handleAddEventSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onAddEvent({
          id: Date.now().toString(),
          title: title.trim(),
          time,
          note
        });
        setTitle('');
        setTime('');
        setNote('');
      };

      const dateObj = new Date(dateStr + 'T00:00:00');
      const dayOfWeekKorean = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];
      const holidayName = getHolidayName(dateStr);

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-150">
            <div className="bg-slate-800 text-white px-5 py-4 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <h3 className="text-lg font-bold">
                    {dateStr} ({dayOfWeekKorean})
                  </h3>
                  {holidayName && (
                    <span className="bg-red-500 text-white text-[10px] font-semibold px-2 py-0.5 rounded-full">
                      {holidayName}
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-300 mt-0.5">근무 수정, 운동 체크 및 일정 관리</p>
              </div>
              <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
              {/* 1. 운동 완료 원터치 체크 영역 */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  운동 기록
                </label>
                <button
                  type="button"
                  onClick={onToggleWorkout}
                  className={`w-full p-3 rounded-xl border transition flex items-center justify-between ${
                    isWorkout
                      ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm'
                      : 'bg-emerald-50/70 text-emerald-900 border-emerald-200 hover:bg-emerald-100'
                  }`}
                >
                  <div className="flex items-center space-x-2.5">
                    <span className="text-lg">🏃</span>
                    <div className="text-left">
                      <div className="font-bold text-xs">{isWorkout ? '오늘 운동 완료!' : '오늘 운동 완료 체크하기'}</div>
                      <div className={`text-[10px] ${isWorkout ? 'text-emerald-100' : 'text-emerald-700'}`}>
                        {isWorkout ? '먼슬리 달력 칸이 초록색으로 표시됩니다' : '터치하여 운동 완료를 기록하세요'}
                      </div>
                    </div>
                  </div>
                  <span className={`text-xs font-bold px-3 py-1.5 rounded-lg transition ${
                    isWorkout ? 'bg-white text-emerald-700 shadow-2xs' : 'bg-emerald-200/80 text-emerald-900'
                  }`}>
                    {isWorkout ? '✓ 완료' : '미완료'}
                  </span>
                </button>
              </div>

              <hr className="border-slate-100" />

              {/* 2. 근무 설정 영역 */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  오늘의 근무 설정
                </label>

                <div className="bg-slate-50 rounded-xl p-3 mb-3 border border-slate-200/80 flex items-center justify-between text-xs">
                  <div>
                    <span className="text-slate-500">자동 계산 스케줄: </span>
                    <span className="font-bold text-slate-800">{autoCalculated.shift}</span>
                    {autoCalculated.isRuleModified && (
                      <span className="text-red-500 font-medium ml-1">({autoCalculated.reason} 비번)</span>
                    )}
                  </div>
                  {isManual ? (
                    <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-md">
                      수동 변경 적용됨
                    </span>
                  ) : (
                    <span className="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-md">
                      자동 스케줄 적용중
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-4 gap-2">
                  {['주간', '당직', '비번', '연차'].map((shiftOpt) => {
                    const isSelected = currentShift === shiftOpt;
                    return (
                      <button
                        key={shiftOpt}
                        onClick={() => onSetOverride(shiftOpt)}
                        className={`py-2 px-3 rounded-xl text-xs font-bold border transition flex flex-col items-center justify-center space-y-1 ${
                          isSelected
                            ? "bg-slate-800 text-white border-slate-800 shadow-sm"
                            : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                        }`}
                      >
                        <span>{shiftOpt}</span>
                      </button>
                    );
                  })}
                </div>

                {isManual && (
                  <button
                    onClick={() => onSetOverride(null)}
                    className="mt-2 text-xs text-blue-600 hover:underline font-medium flex items-center space-x-1"
                  >
                    <i className="fa-rotate-left text-[10px]"></i>
                    <span>기본 자동 스케줄로 복원</span>
                  </button>
                )}
              </div>

              <hr className="border-slate-100" />

              {/* 3. 개인 일정 등록/목록 영역 */}
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  개인 일정 ({events.length})
                </label>

                {events.length > 0 ? (
                  <div className="space-y-2 mb-4">
                    {events.map((evt) => (
                      <div key={evt.id} className="p-2.5 bg-emerald-50/80 border border-emerald-200/80 rounded-xl flex items-center justify-between text-xs">
                        <div>
                          <div className="font-bold text-emerald-950">{evt.title}</div>
                          {evt.time && <div className="text-emerald-700 font-semibold text-[11px]">{evt.time}</div>}
                          {evt.note && <div className="text-emerald-800/80 text-[11px] mt-0.5">{evt.note}</div>}
                        </div>
                        <button
                          onClick={() => onDeleteEvent(evt.id)}
                          className="text-slate-400 hover:text-red-500 p-1.5 transition"
                          title="일정 삭제"
                        >
                          <i className="fa-regular fa-trash-can"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-xs text-slate-400 mb-4 text-center py-2 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                    등록된 개인 일정이 없습니다.
                  </p>
                )}

                <form onSubmit={handleAddEventSubmit} className="space-y-2.5 bg-slate-50/50 p-3 rounded-xl border border-slate-200">
                  <div className="text-xs font-bold text-slate-700 mb-1">새 일정 추가</div>
                  <div className="flex space-x-2">
                    <input
                      type="text"
                      placeholder="일정 제목 (예: 치과 예약)"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      className="flex-1 px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      required
                    />
                    <input
                      type="time"
                      value={time}
                      onChange={(e) => setTime(e.target.value)}
                      className="w-24 px-2 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <input
                    type="text"
                    placeholder="메모 (선택사항)"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <button
                    type="submit"
                    className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition"
                  >
                    일정 등록하기
                  </button>
                </form>
              </div>
            </div>

            <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg hover:bg-slate-900 transition"
              >
                닫기
              </button>
            </div>
          </div>
        </div>
      );
    }

    function SettingsModal({ settings, onSave, onClose }) {
      const [anchorDate, setAnchorDate] = useState(settings.anchorDate);
      const [anchorShift, setAnchorShift] = useState(settings.anchorShift);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ anchorDate, anchorShift });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-150">
            <div className="bg-slate-800 text-white px-5 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <i className="fa-solid fa-sliders text-blue-400"></i>
                <h3 className="text-base font-bold">스케줄 기준 패턴 설정</h3>
              </div>
              <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-800 leading-relaxed">
                <p className="font-semibold mb-1">💡 교대 패턴 작동 규칙</p>
                <p>
                  설정한 <strong>기준일</strong>의 근무부터 시작하여 <br />
                  <span className="font-bold text-blue-900">주간 ➔ 당직 ➔ 비번</span> 순서로 3일 주기가 순환합니다.
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  스케줄 시작 기준일
                </label>
                <input
                  type="date"
                  value={anchorDate}
                  onChange={(e) => setAnchorDate(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  기준일의 근무
                </label>
                <select
                  value={anchorShift}
                  onChange={(e) => setAnchorShift(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >
                  <option value="당직">당직</option>
                  <option value="주간">주간</option>
                  <option value="비번">비번</option>
                </select>
              </div>

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border border-slate-200 text-slate-600 text-xs font-semibold rounded-xl hover:bg-slate-50 transition"
                >
                  취소
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition shadow-sm"
                >
                  설정 저장
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
