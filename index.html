<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스케줄 근무 및 일정 관리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    /* custom scrollbar for event lists inside cells */
    .custom-scrollbar::-webkit-scrollbar {
      width: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20 sm:pb-6">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 한국 공휴일 데이터 ---
    const HOLIDAYS_DATA = {
      // 고정 공휴일 (MM-DD)
      "01-01": "신정",
      "03-01": "삼일절",
      "05-05": "어린이날",
      "06-06": "현충일",
      "08-15": "광복절",
      "10-03": "개천절",
      "10-09": "한글날",
      "12-25": "성탄절",
      // 주요 음력 공휴일 (YYYY-MM-DD)
      "2024-02-09": "설날 연휴", "2024-02-10": "설날", "2024-02-11": "설날 연휴", "2024-02-12": "대체공휴일",
      "2024-05-15": "부처님오신날",
      "2024-09-16": "추석 연휴", "2024-09-17": "추석", "2024-09-18": "추석 연휴",
      "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴",
      "2025-05-05": "부처님오신날", "2025-05-06": "대체공휴일",
      "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일",
      "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
      "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일",
      "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일",
      "2027-05-13": "부처님오신날",
      "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴"
    };

    function getHolidayName(dateStr) {
      if (HOLIDAYS_DATA[dateStr]) return HOLIDAYS_DATA[dateStr];
      const mmdd = dateStr.substring(5);
      if (HOLIDAYS_DATA[mmdd]) return HOLIDAYS_DATA[mmdd];
      return null;
    }

    const SHIFT_TYPES = ['주간', '당직', '비번'];

    function calculateAutoShift(dateStr, settings) {
      const anchor = new Date(settings.anchorDate + 'T00:00:00');
      const target = new Date(dateStr + 'T00:00:00');

      const diffDays = Math.round((target - anchor) / (1000 * 60 * 60 * 24));
      const anchorIdx = SHIFT_TYPES.indexOf(settings.anchorShift);
      
      let rawIdx = (anchorIdx + diffDays) % 3;
      if (rawIdx < 0) rawIdx = (rawIdx + 3) % 3;

      const rawShift = SHIFT_TYPES[rawIdx];

      const dayOfWeek = target.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const holidayName = getHolidayName(dateStr);
      const isHoliday = !!holidayName;

      if (rawShift === '주간' && (isWeekend || isHoliday)) {
        return {
          shift: '비번',
          isRuleModified: true,
          originalShift: '주간',
          reason: isWeekend ? '주말 휴일' : holidayName
        };
      }

      return {
        shift: rawShift,
        isRuleModified: false,
        originalShift: rawShift
      };
    }

    function App() {
      const today = new Date();
      
      // 뷰 모드: 'monthly' | 'weekly'
      const [viewMode, setViewMode] = useState('monthly');

      // 날짜 상태
      const [currentDate, setCurrentDate] = useState(new Date());

      // 1. 패턴 기본 설정
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('shift_app_settings');
        return saved ? JSON.parse(saved) : { anchorDate: '2026-09-01', anchorShift: '당직' };
      });

      // 2. 날짜별 수동 근무 변경
      const [overrides, setOverrides] = useState(() => {
        const saved = localStorage.getItem('shift_app_overrides');
        return saved ? JSON.parse(saved) : {};
      });

      // 3. 날짜별 개인 일정
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('shift_app_events');
        return saved ? JSON.parse(saved) : {};
      });

      // 모달 상태
      const [selectedDateStr, setSelectedDateStr] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('shift_app_settings', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem('shift_app_overrides', JSON.stringify(overrides));
      }, [overrides]);

      useEffect(() => {
        localStorage.setItem('shift_app_events', JSON.stringify(events));
      }, [events]);

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // 이전/다음 이동 핸들러
      const handlePrev = () => {
        const newDate = new Date(currentDate);
        if (viewMode === 'monthly') {
          newDate.setMonth(newDate.getMonth() - 1);
        } else {
          newDate.setDate(newDate.getDate() - 7);
        }
        setCurrentDate(newDate);
      };

      const handleNext = () => {
        const newDate = new Date(currentDate);
        if (viewMode === 'monthly') {
          newDate.setMonth(newDate.getMonth() + 1);
        } else {
          newDate.setDate(newDate.getDate() + 7);
        }
        setCurrentDate(newDate);
      };

      const goToday = () => {
        setCurrentDate(new Date());
      };

      // 날짜 데이터 생성 함수
      const getDayInfo = (d) => {
        const yearStr = d.getFullYear();
        const monthStr = String(d.getMonth() + 1).padStart(2, '0');
        const dayStr = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yearStr}-${monthStr}-${dayStr}`;

        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const dayOfWeek = d.getDay();
        const holidayName = getHolidayName(dateStr);

        let shiftInfo;
        if (overrides[dateStr]) {
          shiftInfo = { shift: overrides[dateStr], isOverride: true, isRuleModified: false };
        } else {
          const auto = calculateAutoShift(dateStr, settings);
          shiftInfo = { shift: auto.shift, isOverride: false, isRuleModified: auto.isRuleModified, reason: auto.reason };
        }

        return {
          dateObj: new Date(d),
          dateStr,
          dayNum: d.getDate(),
          dayOfWeek,
          isToday,
          holidayName,
          shiftInfo,
          dayEvents: events[dateStr] || []
        };
      };

      // 월간 날짜 배열
      const monthlyDays = useMemo(() => {
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - startDate.getDay());

        const endDate = new Date(lastDay);
        if (endDate.getDay() !== 6) {
          endDate.setDate(endDate.getDate() + (6 - endDate.getDay()));
        }

        const days = [];
        let curr = new Date(startDate);

        while (curr <= endDate) {
          const info = getDayInfo(curr);
          info.isCurrentMonth = curr.getMonth() === month;
          days.push(info);
          curr.setDate(curr.getDate() + 1);
        }

        return days;
      }, [year, month, settings, overrides, events]);

      // 주간 날짜 배열 (현재 날짜가 속한 주 일~토)
      const weeklyDays = useMemo(() => {
        const startOfWeek = new Date(currentDate);
        startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

        const days = [];
        let curr = new Date(startOfWeek);

        for (let i = 0; i < 7; i++) {
          const info = getDayInfo(curr);
          info.isCurrentMonth = true;
          days.push(info);
          curr.setDate(curr.getDate() + 1);
        }

        return days;
      }, [currentDate, settings, overrides, events]);

      // 이번달 근무 요약 통계
      const monthSummary = useMemo(() => {
        const summary = { 당직: 0, 주간: 0, 비번: 0, 연차: 0 };
        monthlyDays.forEach(day => {
          if (day.isCurrentMonth) {
            const s = day.shiftInfo.shift;
            if (summary[s] !== undefined) summary[s]++;
          }
        });
        return summary;
      }, [monthlyDays]);

      // 주간 뷰의 기간 텍스트 (예: 2026.08.23 - 08.29)
      const weekRangeText = useMemo(() => {
        if (weeklyDays.length === 0) return '';
        const start = weeklyDays[0].dateStr;
        const end = weeklyDays[6].dateStr;
        return `${start.replace(/-/g, '.')} ~ ${end.substring(5).replace(/-/g, '.')}`;
      }, [weeklyDays]);

      return (
        <div className="max-w-6xl mx-auto px-2 sm:px-4 py-4 sm:py-6">
          {/* 상단 헤더 */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5 mb-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              
              {/* 타이틀 및 날짜 이동 */}
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                  <i className="fa-solid fa-calendar-days text-xl"></i>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight">
                    {viewMode === 'monthly' ? `${year}년 ${month + 1}월` : weekRangeText}
                  </h1>
                  <p className="text-xs text-slate-500 font-medium">
                    {viewMode === 'monthly' ? '월간 근무 및 일정' : '주간 상세 스케줄'}
                  </p>
                </div>
                
                <div className="flex items-center space-x-1 pl-2 sm:pl-4">
                  <button onClick={handlePrev} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                    <i className="fa-solid fa-chevron-left text-sm"></i>
                  </button>
                  <button onClick={goToday} className="px-3 py-1 text-xs font-semibold bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-md transition">
                    오늘
                  </button>
                  <button onClick={handleNext} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                    <i className="fa-solid fa-chevron-right text-sm"></i>
                  </button>
                </div>
              </div>

              {/* 월간/위클리 모드 전환 & 설정 버튼 */}
              <div className="flex items-center justify-between md:justify-end space-x-3 border-t md:border-t-0 pt-3 md:pt-0 border-slate-100">
                {/* 뷰 모드 토글 스위치 */}
                <div className="bg-slate-100 p-1 rounded-xl flex items-center text-xs font-bold">
                  <button
                    onClick={() => setViewMode('monthly')}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      viewMode === 'monthly'
                        ? 'bg-white text-blue-600 shadow-sm'
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    <i className="fa-regular fa-calendar-days mr-1.5"></i>월간
                  </button>
                  <button
                    onClick={() => setViewMode('weekly')}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      viewMode === 'weekly'
                        ? 'bg-white text-blue-600 shadow-sm'
                        : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    <i className="fa-solid fa-list-check mr-1.5"></i>위클리
                  </button>
                </div>

                {/* 패턴 설정 버튼 */}
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="flex items-center space-x-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded-xl transition shadow-sm"
                >
                  <i className="fa-solid fa-gear"></i>
                  <span className="hidden sm:inline">패턴 설정</span>
                </button>
              </div>

            </div>

            {/* 통계 요약 바 (월간 뷰 모드에서만 출력) */}
            {viewMode === 'monthly' && (
              <div className="mt-3 pt-3 border-t border-slate-100 flex items-center space-x-2 text-xs font-semibold overflow-x-auto">
                <span className="text-slate-400 font-normal mr-1">이번달 총계:</span>
                <div className="flex items-center space-x-1 bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-full border border-blue-100">
                  <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                  <span>당직 {monthSummary.당직}</span>
                </div>
                <div className="flex items-center space-x-1 bg-amber-50 text-amber-800 px-2.5 py-0.5 rounded-full border border-amber-100">
                  <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                  <span>주간 {monthSummary.주간}</span>
                </div>
                <div className="flex items-center space-x-1 bg-rose-50 text-rose-700 px-2.5 py-0.5 rounded-full border border-rose-100">
                  <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                  <span>비번 {monthSummary.비번}</span>
                </div>
                {monthSummary.연차 > 0 && (
                  <div className="flex items-center space-x-1 bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-full border border-emerald-100">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span>연차 {monthSummary.연차}</span>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* 1. 월간 (MONTHLY) 뷰 */}
          {viewMode === 'monthly' && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              {/* 요일 헤더 */}
              <div className="grid grid-cols-7 border-b border-slate-200 text-center bg-slate-50/70 font-semibold text-xs py-3 text-slate-600">
                <div className="text-red-500">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div className="text-blue-500">토</div>
              </div>

              {/* 날짜 그리드 (칸 높이를 더욱 길게 확장: min-h-[155px]) */}
              <div className="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-100">
                {monthlyDays.map((day, idx) => {
                  const isSunday = day.dayOfWeek === 0;
                  const isSaturday = day.dayOfWeek === 6;
                  const isHoliday = !!day.holidayName;

                  let dateNumColor = "text-slate-800";
                  if (!day.isCurrentMonth) {
                    dateNumColor = "text-slate-300";
                  } else if (isSunday || isHoliday) {
                    dateNumColor = "text-red-500";
                  } else if (isSaturday) {
                    dateNumColor = "text-blue-500";
                  }

                  return (
                    <div
                      key={idx}
                      onClick={() => setSelectedDateStr(day.dateStr)}
                      className={`min-h-[150px] p-2 transition cursor-pointer flex flex-col justify-between group hover:bg-slate-50/80 ${
                        !day.isCurrentMonth ? "bg-slate-50/40" : "bg-white"
                      } ${day.isToday ? "ring-2 ring-blue-500 ring-inset z-10 bg-blue-50/20" : ""}`}
                    >
                      {/* 셀 상단: 날짜 및 공휴일 */}
                      <div>
                        <div className="flex items-start justify-between">
                          <span className={`text-sm font-bold ${dateNumColor}`}>
                            {day.dayNum}
                          </span>

                          {day.isToday && (
                            <span className="text-[10px] font-bold bg-blue-600 text-white px-1.5 py-0.2 rounded-full shadow-xs">
                              오늘
                            </span>
                          )}
                        </div>

                        {day.holidayName && day.isCurrentMonth && (
                          <div className="text-[10px] font-semibold text-red-500 truncate leading-tight mt-0.5">
                            {day.holidayName}
                          </div>
                        )}
                      </div>

                      {/* 셀 중앙: 근무 배지 */}
                      <div className="my-2 flex flex-col items-center justify-center">
                        <ShiftBadge info={day.shiftInfo} />
                      </div>

                      {/* 셀 하단: 등록된 일정 스크롤 목록 (확장된 공간) */}
                      <div className="space-y-1 mt-auto max-h-[65px] overflow-y-auto custom-scrollbar pr-0.5">
                        {day.dayEvents.map((evt) => (
                          <div
                            key={evt.id}
                            className="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-1.5 py-1 rounded-md truncate font-medium flex items-center justify-between border border-slate-200/60"
                          >
                            <span className="truncate">{evt.title}</span>
                            {evt.time && <span className="text-[9px] text-slate-400 pl-1 shrink-0">{evt.time}</span>}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 2. 위클리 (WEEKLY) 뷰 */}
          {viewMode === 'weekly' && (
            <div className="space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-7 gap-3">
                {weeklyDays.map((day, idx) => {
                  const isSunday = day.dayOfWeek === 0;
                  const isSaturday = day.dayOfWeek === 6;
                  const isHoliday = !!day.holidayName;
                  const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

                  let headerBg = "bg-slate-50 text-slate-700";
                  let dateNumColor = "text-slate-800";

                  if (day.isToday) {
                    headerBg = "bg-blue-600 text-white";
                    dateNumColor = "text-white";
                  } else if (isSunday || isHoliday) {
                    dateNumColor = "text-red-500";
                  } else if (isSaturday) {
                    dateNumColor = "text-blue-500";
                  }

                  return (
                    <div
                      key={idx}
                      className={`bg-white rounded-2xl shadow-sm border transition flex flex-col justify-between overflow-hidden ${
                        day.isToday ? "ring-2 ring-blue-500 border-blue-500" : "border-slate-200"
                      }`}
                    >
                      {/* 카드 헤더 */}
                      <div className={`p-3 border-b flex items-center justify-between ${headerBg}`}>
                        <div>
                          <div className="text-xs font-semibold opacity-90">{dayNames[day.dayOfWeek]}</div>
                          <div className={`text-lg font-bold leading-none ${dateNumColor}`}>
                            {day.dateStr.substring(5).replace('-', '.')}
                          </div>
                        </div>
                        {day.holidayName && (
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${day.isToday ? 'bg-red-500 text-white' : 'bg-red-100 text-red-600'}`}>
                            {day.holidayName}
                          </span>
                        )}
                      </div>

                      {/* 카드 바디 */}
                      <div className="p-3 flex-1 flex flex-col justify-between space-y-3">
                        {/* 근무 배지 */}
                        <div className="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100">
                          <span className="text-xs font-semibold text-slate-500">오늘의 근무</span>
                          <ShiftBadge info={day.shiftInfo} />
                        </div>

                        {/* 개인 일정 목록 */}
                        <div className="space-y-1.5 flex-1 min-h-[100px]">
                          <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center justify-between">
                            <span>일정 ({day.dayEvents.length})</span>
                          </div>

                          {day.dayEvents.length > 0 ? (
                            day.dayEvents.map((evt) => (
                              <div
                                key={evt.id}
                                className="text-xs bg-slate-50 hover:bg-slate-100 text-slate-800 p-2 rounded-xl border border-slate-200/80 space-y-0.5"
                              >
                                <div className="font-semibold flex items-center justify-between">
                                  <span>{evt.title}</span>
                                  {evt.time && <span className="text-[10px] text-blue-600 font-bold bg-blue-50 px-1.5 py-0.5 rounded">{evt.time}</span>}
                                </div>
                                {evt.note && <div className="text-[10px] text-slate-500 leading-tight">{evt.note}</div>}
                              </div>
                            ))
                          ) : (
                            <div className="text-[11px] text-slate-300 text-center py-6">
                              일정 없음
                            </div>
                          )}
                        </div>

                        {/* 일정 및 근무 편집 버튼 */}
                        <button
                          onClick={() => setSelectedDateStr(day.dateStr)}
                          className="w-full py-1.5 text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-xl transition flex items-center justify-center space-x-1"
                        >
                          <i className="fa-solid fa-plus text-[10px]"></i>
                          <span>일정/근무 수정</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 하단 내비게이션 바 (모바일 및 간편 모드 전환용) */}
          <div className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 py-2.5 px-6 sm:hidden z-40 flex items-center justify-around shadow-lg">
            <button
              onClick={() => setViewMode('monthly')}
              className={`flex flex-col items-center space-y-1 ${viewMode === 'monthly' ? 'text-blue-600 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-regular fa-calendar-days text-base"></i>
              <span className="text-[10px]">월간 달력</span>
            </button>
            <button
              onClick={() => setViewMode('weekly')}
              className={`flex flex-col items-center space-y-1 ${viewMode === 'weekly' ? 'text-blue-600 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-solid fa-list-check text-base"></i>
              <span className="text-[10px]">위클리 스케줄</span>
            </button>
            <button
              onClick={() => setIsSettingsOpen(true)}
              className="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-700"
            >
              <i className="fa-solid fa-gear text-base"></i>
              <span className="text-[10px]">패턴 설정</span>
            </button>
          </div>

          {/* 범례 및 안내 */}
          <div className="mt-4 bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-xs text-slate-500 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center space-x-4">
              <span className="font-semibold text-slate-700">근무 범례:</span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-blue-600 rounded-full inline-block"></span><span>당직</span></span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-amber-400 rounded-full inline-block"></span><span>주간</span></span>
              <span className="flex items-center space-x-1"><span className="text-red-600 font-bold">비번</span><span>비번</span></span>
              <span className="flex items-center space-x-1"><span className="w-3.5 h-3.5 bg-emerald-600 rounded-full inline-block"></span><span>연차/기타</span></span>
            </div>
            <div className="text-slate-400 text-[11px]">
              * 주간 근무일이 토/일/공휴일인 경우 자동으로 비번 전환됩니다.
            </div>
          </div>

          {/* 모달 1: 날짜 상세 & 수동 편집 모달 */}
          {selectedDateStr && (
            <DateDetailModal
              dateStr={selectedDateStr}
              onClose={() => setSelectedDateStr(null)}
              settings={settings}
              overrideShift={overrides[selectedDateStr]}
              onSetOverride={(shift) => {
                if (shift === null) {
                  const copy = { ...overrides };
                  delete copy[selectedDateStr];
                  setOverrides(copy);
                } else {
                  setOverrides({ ...overrides, [selectedDateStr]: shift });
                }
              }}
              events={events[selectedDateStr] || []}
              onAddEvent={(newEvent) => {
                const list = events[selectedDateStr] || [];
                setEvents({ ...events, [selectedDateStr]: [...list, newEvent] });
              }}
              onDeleteEvent={(eventId) => {
                const list = events[selectedDateStr] || [];
                setEvents({
                  ...events,
                  [selectedDateStr]: list.filter((e) => e.id !== eventId)
                });
              }}
            />
          )}

          {/* 모달 2: 패턴 설정 모달 */}
          {isSettingsOpen && (
            <SettingsModal
              settings={settings}
              onSave={(newSettings) => {
                setSettings(newSettings);
                setIsSettingsOpen(false);
              }}
              onClose={() => setIsSettingsOpen(false)}
            />
          )}
        </div>
      );
    }

    // 근무 배지 컴포넌트
    function ShiftBadge({ info }) {
      const { shift, isOverride, isRuleModified } = info;

      if (shift === '당직') {
        return (
          <div className="relative group">
            <span className="w-7 h-7 bg-blue-600 text-white rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
              당
            </span>
            {isOverride && (
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 border-2 border-white rounded-full" title="수동 수정됨"></span>
            )}
          </div>
        );
      }

      if (shift === '주간') {
        return (
          <div className="relative group">
            <span className="w-7 h-7 bg-amber-400 text-slate-900 rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
              주
            </span>
            {isOverride && (
              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-blue-600 border-2 border-white rounded-full" title="수동 수정됨"></span>
            )}
          </div>
        );
      }

      if (shift === '비번') {
        return (
          <div className="relative flex items-center">
            <span className="text-red-600 font-extrabold text-xs px-1.5 py-0.5 rounded border border-red-100 bg-red-50/60">
              비번
            </span>
            {isRuleModified && !isOverride && (
              <span className="text-[9px] text-red-400 font-normal ml-0.5" title="주간일이나 휴일로 인해 비번 변경됨">
                (휴)
              </span>
            )}
            {isOverride && (
              <span className="w-1.5 h-1.5 bg-amber-500 rounded-full ml-1" title="수동 수정됨"></span>
            )}
          </div>
        );
      }

      return (
        <span className="w-7 h-7 bg-emerald-600 text-white rounded-full flex items-center justify-center text-xs font-bold shadow-xs">
          {shift.substring(0, 1)}
        </span>
      );
    }

    // 날짜 상세 및 수정 모달
    function DateDetailModal({
      dateStr,
      onClose,
      settings,
      overrideShift,
      onSetOverride,
      events,
      onAddEvent,
      onDeleteEvent
    }) {
      const autoCalculated = calculateAutoShift(dateStr, settings);
      const currentShift = overrideShift || autoCalculated.shift;
      const isManual = !!overrideShift;

      const [title, setTitle] = useState('');
      const [time, setTime] = useState('');
      const [note, setNote] = useState('');

      const handleAddEventSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        onAddEvent({
          id: Date.now().toString(),
          title: title.trim(),
          time,
          note
        });
        setTitle('');
        setTime('');
        setNote('');
      };

      const dateObj = new Date(dateStr + 'T00:00:00');
      const dayOfWeekKorean = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];
      const holidayName = getHolidayName(dateStr);

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-150">
            
            <div className="bg-slate-800 text-white px-5 py-4 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <h3 className="text-lg font-bold">
                    {dateStr} ({dayOfWeekKorean})
                  </h3>
                  {holidayName && (
                    <span className="bg-red-500 text-white text-[10px] font-semibold px-2 py-0.5 rounded-full">
                      {holidayName}
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-300 mt-0.5">근무 수정 및 개인 일정 등록</p>
              </div>
              <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  오늘의 근무 설정
                </label>

                <div className="bg-slate-50 rounded-xl p-3 mb-3 border border-slate-200/80 flex items-center justify-between text-xs">
                  <div>
                    <span className="text-slate-500">자동 계산 스케줄: </span>
                    <span className="font-bold text-slate-800">{autoCalculated.shift}</span>
                    {autoCalculated.isRuleModified && (
                      <span className="text-red-500 font-medium ml-1">({autoCalculated.reason} 비번)</span>
                    )}
                  </div>
                  {isManual ? (
                    <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-md">
                      수동 변경 적용됨
                    </span>
                  ) : (
                    <span className="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-md">
                      자동 스케줄 적용중
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-4 gap-2">
                  {['주간', '당직', '비번', '연차'].map((shiftOpt) => {
                    const isSelected = currentShift === shiftOpt;
                    return (
                      <button
                        key={shiftOpt}
                        onClick={() => onSetOverride(shiftOpt)}
                        className={`py-2 px-3 rounded-xl text-xs font-bold border transition flex flex-col items-center justify-center space-y-1 ${
                          isSelected
                            ? "bg-slate-800 text-white border-slate-800 shadow-sm"
                            : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"
                        }`}
                      >
                        <span>{shiftOpt}</span>
                      </button>
                    );
                  })}
                </div>

                {isManual && (
                  <button
                    onClick={() => onSetOverride(null)}
                    className="mt-2 text-xs text-blue-600 hover:underline font-medium flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-rotate-left text-[10px]"></i>
                    <span>기본 자동 스케줄로 복원</span>
                  </button>
                )}
              </div>

              <hr className="border-slate-100" />

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                  개인 일정 ({events.length})
                </label>

                {events.length > 0 ? (
                  <div className="space-y-2 mb-4">
                    {events.map((evt) => (
                      <div key={evt.id} className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                        <div>
                          <div className="font-semibold text-slate-800">{evt.title}</div>
                          {evt.time && <div className="text-slate-400 text-[11px]">{evt.time}</div>}
                          {evt.note && <div className="text-slate-500 text-[11px] mt-0.5">{evt.note}</div>}
                        </div>
                        <button
                          onClick={() => onDeleteEvent(evt.id)}
                          className="text-slate-400 hover:text-red-500 p-1.5 transition"
                          title="일정 삭제"
                        >
                          <i className="fa-regular fa-trash-can"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-xs text-slate-400 mb-4 text-center py-2 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                    등록된 개인 일정이 없습니다.
                  </p>
                )}

                <form onSubmit={handleAddEventSubmit} className="space-y-2.5 bg-slate-50/50 p-3 rounded-xl border border-slate-200">
                  <div className="text-xs font-bold text-slate-700 mb-1">새 일정 추가</div>
                  <div className="flex space-x-2">
                    <input
                      type="text"
                      placeholder="일정 제목 (예: 치과 예약)"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      className="flex-1 px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      required
                    />
                    <input
                      type="time"
                      value={time}
                      onChange={(e) => setTime(e.target.value)}
                      className="w-24 px-2 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <input
                    type="text"
                    placeholder="메모 (선택사항)"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <button
                    type="submit"
                    className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition"
                  >
                    일정 등록하기
                  </button>
                </form>
              </div>

            </div>

            <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-end">
              <button
                onClick={onClose}
                className="px-4 py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg hover:bg-slate-900 transition"
              >
                닫기
              </button>
            </div>

          </div>
        </div>
      );
    }

    // 패턴 설정 모달
    function SettingsModal({ settings, onSave, onClose }) {
      const [anchorDate, setAnchorDate] = useState(settings.anchorDate);
      const [anchorShift, setAnchorShift] = useState(settings.anchorShift);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ anchorDate, anchorShift });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-150">
            
            <div className="bg-slate-800 text-white px-5 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <i className="fa-solid fa-sliders text-blue-400"></i>
                <h3 className="text-base font-bold">스케줄 기준 패턴 설정</h3>
              </div>
              <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-800 leading-relaxed">
                <p className="font-semibold mb-1">💡 교대 패턴 작동 규칙</p>
                <p>
                  설정한 <strong>기준일</strong>의 근무부터 시작하여 <br />
                  <span className="font-bold text-blue-900">주간 ➔ 당직 ➔ 비번</span> 순서로 3일 주기가 순환합니다.
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  스케줄 시작 기준일
                </label>
                <input
                  type="date"
                  value={anchorDate}
                  onChange={(e) => setAnchorDate(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  기준일의 근무
                </label>
                <select
                  value={anchorShift}
                  onChange={(e) => setAnchorShift(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >
                  <option value="당직">당직</option>
                  <option value="주간">주간</option>
                  <option value="비번">비번</option>
                </select>
              </div>

              <div className="pt-2 flex justify-end space-x-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border border-slate-200 text-slate-600 text-xs font-semibold rounded-xl hover:bg-slate-50 transition"
                >
                  취소
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition shadow-sm"
                >
                  설정 저장
                </button>
              </div>
            </form>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
