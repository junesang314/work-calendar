<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스케줄 근무 및 일정 관리</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" href="icon.png">
  <meta name="apple-mobile-web-app-title" content="근무표">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; touch-action: manipulation; }
    .custom-scrollbar::-webkit-scrollbar { width: 3px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-16 sm:pb-6 select-none overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SUPABASE_URL = 'https://vpwfnoqrmcerddtyatst.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XcbXQlPwLWWwKwL-lZ6hnw_WvR2j_zQ';
    
    const getSupabase = () => {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    };

    const HOLIDAYS_DATA = {
      "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절",
      "2024-02-09": "설날 연휴", "2024-02-10": "설날", "2024-02-11": "설날 연휴", "2024-02-12": "대체공휴일", "2024-05-15": "부처님오신날", "2024-09-16": "추석 연휴", "2024-09-17": "추석", "2024-09-18": "추석 연휴",
      "2025-01-28": "설날 연휴", "2025-01-29": "설날", "2025-01-30": "설날 연휴", "2025-05-05": "부처님오신날", "2025-05-06": "대체공휴일", "2025-10-05": "추석 연휴", "2025-10-06": "추석", "2025-10-07": "추석 연휴", "2025-10-08": "대체공휴일",
      "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
      "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일", "2027-05-13": "부처님오신날", "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴"
    };

    function getHolidayName(dateStr) {
      if (!dateStr) return null;
      if (HOLIDAYS_DATA[dateStr]) return HOLIDAYS_DATA[dateStr];
      const mmdd = dateStr.substring(5);
      if (HOLIDAYS_DATA[mmdd]) return HOLIDAYS_DATA[mmdd];
      return null;
    }

    const SHIFT_TYPES = ['주간', '당직', '비번'];

    function calculateAutoShift(dateStr, settings) {
      if (!dateStr) return { shift: '당직', isRuleModified: false, originalShift: '당직' };
      const anchor = new Date(settings.anchorDate + 'T00:00:00');
      const target = new Date(dateStr + 'T00:00:00');
      const diffDays = Math.round((target - anchor) / (1000 * 60 * 60 * 24));
      const anchorIdx = SHIFT_TYPES.indexOf(settings.anchorShift);
      let rawIdx = (anchorIdx + diffDays) % 3;
      if (rawIdx < 0) rawIdx = (rawIdx + 3) % 3;
      const rawShift = SHIFT_TYPES[rawIdx];
      const dayOfWeek = target.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const holidayName = getHolidayName(dateStr);
      const isHoliday = !!holidayName;

      if (rawShift === '주간' && (isWeekend || isHoliday)) {
        return { shift: '비번', isRuleModified: true, originalShift: '주간', reason: isWeekend ? '주말 휴일' : holidayName };
      }
      return { shift: rawShift, isRuleModified: false, originalShift: rawShift };
    }

    function parseWorkout(val) {
      if (!val) return { types: [], details: {} };
      if (typeof val === 'string') {
        if (val === 'crossfit' || val === '크로스핏') return { types: ['crossfit'], details: {} };
        if (val === 'running' || val === '달리기') return { types: ['running'], details: {} };
        return { types: [], details: {} };
      }
      return { types: val.types || [], details: val.details || {} };
    }

    function App() {
      const today = new Date();
      const [viewMode, setViewMode] = useState('monthly');
      const [isWorkoutMode, setIsWorkoutMode] = useState(false);
      const [currentDate, setCurrentDate] = useState(new Date());
      const [user, setUser] = useState(() => localStorage.getItem('shift_app_custom_user') || null);
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [isAnimating, setIsAnimating] = useState(false);
      const pendingDirectionRef = useRef(0);
      const touchStartRef = useRef({ x: 0, y: 0, time: 0 });
      const containerRef = useRef(null);

      const [previewDayInfo, setPreviewDayInfo] = useState(null);
      const [workoutPreviewDayInfo, setWorkoutPreviewDayInfo] = useState(null);
      const longPressTimerRef = useRef(null);
      const isLongPressedRef = useRef(false);

      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const headerLongPressTimerRef = useRef(null);
      const isHeaderLongPressedRef = useRef(false);

      const handleHeaderTouchStart = () => {
        isHeaderLongPressedRef.current = false;
        headerLongPressTimerRef.current = setTimeout(() => {
          isHeaderLongPressedRef.current = true;
          setIsShareModalOpen(true);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 500);
      };

      const handleHeaderTouchEnd = () => {
        if (headerLongPressTimerRef.current) {
          clearTimeout(headerLongPressTimerRef.current);
          headerLongPressTimerRef.current = null;
        }
      };

      const handleHeaderClick = () => {
        if (isHeaderLongPressedRef.current) {
          isHeaderLongPressedRef.current = false;
          return;
        }
        toggleYearlyView();
      };

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('shift_app_settings');
        return saved ? JSON.parse(saved) : { anchorDate: '2026-09-01', anchorShift: '당직' };
      });

      const [overrides, setOverrides] = useState(() => {
        const saved = localStorage.getItem('shift_app_overrides');
        return saved ? JSON.parse(saved) : {};
      });

      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('shift_app_events');
        return saved ? JSON.parse(saved) : {};
      });

      const [workouts, setWorkouts] = useState(() => {
        const saved = localStorage.getItem('shift_app_workouts');
        return saved ? JSON.parse(saved) : {};
      });

      const [dataLoaded, setDataLoaded] = useState(false);
      const [selectedDateStr, setSelectedDateStr] = useState(null);
      const [quickWorkoutModalDay, setQuickWorkoutModalDay] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      useEffect(() => {
        const client = getSupabase();
        if (user && client) {
          fetchUserData(user, client);
        } else {
          setDataLoaded(true);
        }
      }, [user]);

      const fetchUserData = async (username, client) => {
        try {
          const { data } = await client.from('user_schedules').select('*').eq('user_id', username).single();
          if (data) {
            if (data.settings) setSettings(data.settings);
            if (data.overrides) setOverrides(data.overrides);
            if (data.events) setEvents(data.events);
            if (data.workouts) setWorkouts(data.workouts);
          } else {
            await saveUserData(username, settings, overrides, events, workouts, client);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setDataLoaded(true);
        }
      };

      const saveUserData = async (username, newSettings, newOverrides, newEvents, newWorkouts, explicitClient) => {
        const client = explicitClient || getSupabase();
        if (!username || !client) return;
        try {
          await client.from('user_schedules').upsert({
            user_id: username, settings: newSettings, overrides: newOverrides, events: newEvents, workouts: newWorkouts, updated_at: new Date()
          });
        } catch (err) {
          console.error(err);
        }
      };

      useEffect(() => {
        if (!dataLoaded) return;
        const client = getSupabase();
        if (user && client) {
          saveUserData(user, settings, overrides, events, workouts, client);
        }
        localStorage.setItem('shift_app_settings', JSON.stringify(settings));
        localStorage.setItem('shift_app_overrides', JSON.stringify(overrides));
        localStorage.setItem('shift_app_events', JSON.stringify(events));
        localStorage.setItem('shift_app_workouts', JSON.stringify(workouts));
      }, [settings, overrides, events, workouts, user, dataLoaded]);

      const updateWorkoutData = (dateStr, newTypes, newDetails) => {
        if (!dateStr) return;
        setWorkouts(prev => {
          const next = { ...prev };
          if (newTypes.length === 0) {
            delete next[dateStr];
          } else {
            next[dateStr] = { types: newTypes, details: newDetails };
          }
          return next;
        });
      };

      const getRelativeDate = (baseDate, offset) => {
        const d = new Date(baseDate);
        if (viewMode === 'yearly') d.setFullYear(d.getFullYear() + offset);
        else if (viewMode === 'monthly') d.setMonth(d.getMonth() + offset);
        else if (viewMode === 'weekly') d.setDate(d.getDate() + (offset * 7));
        return d;
      };

      const prevDate = useMemo(() => getRelativeDate(currentDate, -1), [currentDate, viewMode]);
      const currDate = currentDate;
      const nextDate = useMemo(() => getRelativeDate(currentDate, 1), [currentDate, viewMode]);

      const goToday = () => { setCurrentDate(new Date()); setDragX(0); };

      const handleTouchStart = (e) => {
        if (isAnimating) return;
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
        setIsDragging(true); setIsAnimating(false);
      };

      const handleTouchMove = (e) => {
        if (!isDragging) return;
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const deltaX = currentX - touchStartRef.current.x;
        const deltaY = currentY - touchStartRef.current.y;
        if (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8) {
          if (longPressTimerRef.current) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = null; }
        }
        if (Math.abs(deltaX) > Math.abs(deltaY)) setDragX(deltaX);
      };

      const handleTouchEnd = () => {
        if (longPressTimerRef.current) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = null; }
        if (!isDragging) return;
        setIsDragging(false);
        const duration = Date.now() - touchStartRef.current.time;
        const velocity = Math.abs(dragX) / duration;
        const containerWidth = containerRef.current ? containerRef.current.clientWidth : window.innerWidth;
        if (dragX < -60 || (dragX < -25 && velocity > 0.25)) {
          pendingDirectionRef.current = -1; setIsAnimating(true); setDragX(-containerWidth);
        } else if (dragX > 60 || (dragX > 25 && velocity > 0.25)) {
          pendingDirectionRef.current = 1; setIsAnimating(true); setDragX(containerWidth);
        } else {
          pendingDirectionRef.current = 0; setIsAnimating(true); setDragX(0);
        }
      };

      const handleTransitionEnd = () => {
        if (!isAnimating) return;
        const dir = pendingDirectionRef.current;
        if (dir !== 0) setCurrentDate(prev => getRelativeDate(prev, dir === -1 ? 1 : -1));
        setIsAnimating(false); setDragX(0); pendingDirectionRef.current = 0;
      };

      const handleCellTouchStart = (day) => {
        isLongPressedRef.current = false;
        longPressTimerRef.current = setTimeout(() => {
          isLongPressedRef.current = true;
          if (isWorkoutMode) {
            setWorkoutPreviewDayInfo(day);
          } else {
            setPreviewDayInfo(day);
          }
          if (navigator.vibrate) navigator.vibrate(40);
        }, 450);
      };

      const handleCellTouchEnd = () => {
        if (longPressTimerRef.current) { clearTimeout(longPressTimerRef.current); longPressTimerRef.current = null; }
      };

      const handleCellClick = (day) => {
        if (isLongPressedRef.current) { isLongPressedRef.current = false; return; }
        if (isWorkoutMode) {
          if (day && day.dateStr) setQuickWorkoutModalDay(day);
        } else {
          if (day && day.dateStr) setSelectedDateStr(day.dateStr);
        }
      };

      const getDayInfo = (d) => {
        const yearStr = d.getFullYear();
        const monthStr = String(d.getMonth() + 1).padStart(2, '0');
        const dayStr = String(d.getDate()).padStart(2, '0');
        const dateStr = `${yearStr}-${monthStr}-${dayStr}`;
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;
        const dayOfWeek = d.getDay();
        const holidayName = getHolidayName(dateStr);
        
        const workoutParsed = parseWorkout(workouts[dateStr]);
        const hasWorkout = workoutParsed.types.length > 0;

        let shiftInfo;
        if (overrides[dateStr]) {
          shiftInfo = { shift: overrides[dateStr], isOverride: true, isRuleModified: false };
        } else {
          const auto = calculateAutoShift(dateStr, settings);
          shiftInfo = { shift: auto.shift, isOverride: false, isRuleModified: auto.isRuleModified, reason: auto.reason };
        }
        return { 
          dateObj: new Date(d), 
          dateStr, 
          dayNum: d.getDate(), 
          dayOfWeek, 
          isToday, 
          holidayName, 
          shiftInfo, 
          workoutParsed, 
          hasWorkout, 
          dayEvents: events[dateStr] || [] 
        };
      };

      const getMonthlyDays = (targetDate) => {
        const y = targetDate.getFullYear();
        const m = targetDate.getMonth();
        const firstDay = new Date(y, m, 1);
        const lastDay = new Date(y, m + 1, 0);
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - startDate.getDay());
        const totalCellsNeeded = (lastDay.getDate() + firstDay.getDay() > 35) ? 42 : 35;
        const days = [];
        let curr = new Date(startDate);
        for (let i = 0; i < totalCellsNeeded; i++) {
          const info = getDayInfo(curr);
          info.isCurrentMonth = curr.getMonth() === m;
          days.push(info);
          curr.setDate(curr.getDate() + 1);
        }
        return days;
      };

      const getWeeklyDays = (targetDate) => {
        const startOfWeek = new Date(targetDate);
        startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
        const days = [];
        let curr = new Date(startOfWeek);
        for (let i = 0; i < 7; i++) {
          const info = getDayInfo(curr);
          info.isCurrentMonth = true;
          days.push(info);
          curr.setDate(curr.getDate() + 1);
        }
        return days;
      };

      const currMonthlyDays = useMemo(() => getMonthlyDays(currDate), [currDate, settings, overrides, events, workouts]);

      const monthSummary = useMemo(() => {
        const summary = { 당직: 0, 주간: 0, 비번: 0, 연차: 0, 달리기: 0, 크로스핏: 0, 총운동: 0 };
        currMonthlyDays.forEach(day => {
          if (day.isCurrentMonth) {
            const s = day.shiftInfo.shift;
            if (summary[s] !== undefined) summary[s]++;
            if (day.hasWorkout) {
              summary.총운동++;
              if (day.workoutParsed.types.includes('crossfit')) summary.크로스핏++;
              if (day.workoutParsed.types.includes('running')) summary.달리기++;
            }
          }
        });
        return summary;
      }, [currMonthlyDays]);

      const weekRangeText = useMemo(() => {
        const days = getWeeklyDays(currDate);
        if (days.length === 0) return '';
        const start = days[0].dateStr;
        const end = days[6].dateStr;
        return `${start.replace(/-/g, '.')} ~ ${end.substring(5).replace(/-/g, '.')}`;
      }, [currDate, settings, overrides, events, workouts]);

      const toggleYearlyView = () => { setViewMode(prev => (prev === 'yearly' ? 'monthly' : 'yearly')); setDragX(0); };

      const renderViewContent = (targetDate) => {
        if (viewMode === 'monthly') {
          const days = getMonthlyDays(targetDate);
          return (
            <div className={`rounded-2xl shadow-sm border overflow-hidden transition-colors ${isWorkoutMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
              <div className={`grid grid-cols-7 border-b text-center font-semibold text-xs py-2.5 ${isWorkoutMode ? 'bg-slate-950 text-slate-400 border-slate-800' : 'bg-slate-50/70 text-slate-600 border-slate-200'}`}>
                <div className="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div className="text-blue-400">토</div>
              </div>
              <div className={`grid grid-cols-7 auto-rows-fr divide-x divide-y ${isWorkoutMode ? 'divide-slate-800' : 'divide-slate-100'}`}>
                {days.map((day, idx) => {
                  const isSunday = day.dayOfWeek === 0;
                  const isSaturday = day.dayOfWeek === 6;
                  const isHoliday = !!day.holidayName;
                  let dateNumColor = isWorkoutMode ? "text-slate-200" : "text-slate-800";
                  if (!day.isCurrentMonth) dateNumColor = isWorkoutMode ? "text-slate-600" : "text-slate-300";
                  else if (day.hasWorkout) {
                    if (isSunday || isHoliday) dateNumColor = "text-amber-200 font-black";
                    else if (isSaturday) dateNumColor = "text-amber-200 font-black";
                    else dateNumColor = "text-white font-black";
                  } else if (isSunday || isHoliday) dateNumColor = "text-red-400 font-bold";
                  else if (isSaturday) dateNumColor = "text-blue-400 font-bold";

                  let cellBgStyle = isWorkoutMode ? 'bg-slate-900' : 'bg-white';
                  if (!day.isCurrentMonth) cellBgStyle = isWorkoutMode ? "bg-slate-950/80" : "bg-slate-50/40";
                  else if (day.hasWorkout) cellBgStyle = isWorkoutMode ? "bg-amber-600/90 border-amber-500/60 shadow-md" : "bg-blue-800/60 border-blue-400/50 shadow-sm";

                  return (
                    <div
                      key={idx}
                      onTouchStart={() => handleCellTouchStart(day)}
                      onTouchEnd={handleCellTouchEnd}
                      onMouseDown={() => handleCellTouchStart(day)}
                      onMouseUp={handleCellTouchEnd}
                      onClick={() => handleCellClick(day)}
                      className={`min-h-[100px] sm:min-h-[115px] p-1.5 transition cursor-pointer flex flex-col justify-between group hover:brightness-110 active:scale-[0.99] ${cellBgStyle} ${day.isToday ? "ring-2 ring-blue-500 ring-inset z-10" : ""}`}
                    >
                      <div>
                        <div className="flex items-center justify-between leading-none">
                          <div className="flex items-center space-x-1 truncate">
                            <span className={`text-xs sm:text-sm ${dateNumColor}`}>{day.dayNum}</span>
                            {day.holidayName && day.isCurrentMonth && (
                              <span className={`text-[9.5px] font-semibold truncate ${day.hasWorkout ? 'text-amber-200 font-bold' : 'text-red-400'}`}>{day.holidayName}</span>
                            )}
                          </div>
                          {day.hasWorkout && day.isCurrentMonth && (
                            <div className="flex items-center space-x-0.5 shrink-0">
                              {day.workoutParsed.types.map(t => (
                                <span key={t} className="text-[10px] rounded-md px-1 py-0.2 font-bold shadow-xs border bg-amber-800 text-white border-amber-400/60" title={t === 'running' ? '달리기' : '크로스핏'}>
                                  {t === 'running' ? '🏃' : '🏋️'}
                                </span>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                      <div className="my-0.5 flex flex-col items-center justify-center">
                        {isWorkoutMode ? (
                          <div className="text-xs font-bold text-slate-100">
                            {day.isCurrentMonth && day.shiftInfo.shift}
                          </div>
                        ) : (
                          <ShiftBadge info={day.shiftInfo} isDarkBg={day.hasWorkout && day.isCurrentMonth} />
                        )}
                      </div>
                      <div className="space-y-0.5 mt-auto max-h-[34px] overflow-hidden">
                        {isWorkoutMode ? (
                          null
                        ) : (
                          <>
                            {day.dayEvents.slice(0, 1).map((evt) => (
                              <div key={evt.id} className={`text-[9px] px-1.5 py-0.5 rounded truncate font-semibold flex items-center justify-between shadow-2xs border ${day.hasWorkout ? "bg-white/95 text-slate-900 border-blue-200" : "bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border-emerald-200/80"}`}>
                                <span className="truncate">{evt.title}</span>
                                {evt.time && <span className={`text-[8px] pl-1 shrink-0 font-bold ${day.hasWorkout ? 'text-blue-800' : 'text-emerald-700'}`}>{evt.time}</span>}
                              </div>
                            ))}
                            {day.dayEvents.length > 1 && (
                              <div className={`text-[7.5px] text-right font-bold leading-none ${day.hasWorkout ? 'text-blue-200' : 'text-slate-400'}`}>
                                +{day.dayEvents.length - 1}
                              </div>
                            )}
                          </>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        if (viewMode === 'weekly') {
          const days = getWeeklyDays(targetDate);
          return (
            <div className="space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-7 gap-2.5">
                {days.map((day, idx) => {
                  const isSunday = day.dayOfWeek === 0;
                  const isSaturday = day.dayOfWeek === 6;
                  const isHoliday = !!day.holidayName;
                  const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
                  
                  let headerBg = isWorkoutMode ? "bg-slate-950 text-slate-300 border-b border-slate-800" : "bg-slate-50 text-slate-700";
                  let dateNumColor = isWorkoutMode ? "text-slate-100" : "text-slate-800";
                  
                  if (day.isToday && !isWorkoutMode) { 
                    headerBg = "bg-blue-600 text-white"; 
                    dateNumColor = "text-white"; 
                  } else if (isSunday || isHoliday) {
                    dateNumColor = isWorkoutMode ? "text-amber-300" : "text-red-500";
                  } else if (isSaturday) {
                    dateNumColor = isWorkoutMode ? "text-amber-300" : "text-blue-500";
                  }

                  const shift = day.shiftInfo.shift;
                  
                  let shiftBoxStyle = isWorkoutMode ? "bg-slate-800/80 border-slate-700/60 text-slate-300" : "bg-white border-slate-200";
                  if (!isWorkoutMode) {
                    if (shift === '주간') shiftBoxStyle = "bg-amber-100/90 border-amber-300";
                    else if (shift === '당직') shiftBoxStyle = "bg-blue-100/90 border-blue-300";
                    else if (shift === '비번') shiftBoxStyle = "bg-rose-100/80 border-rose-200";
                  }

                  let cardBg = isWorkoutMode ? "bg-slate-900 border-slate-800 text-white" : "bg-white border-slate-200";
                  if (day.hasWorkout) {
                    cardBg = isWorkoutMode ? "bg-amber-600/90 border-amber-500/60 shadow-md text-white" : "bg-blue-50/40 ring-2 ring-blue-800 border-blue-800";
                  }

                  return (
                    <div 
                      key={idx} 
                      onTouchStart={() => handleCellTouchStart(day)}
                      onTouchEnd={handleCellTouchEnd}
                      onMouseDown={() => handleCellTouchStart(day)}
                      onMouseUp={handleCellTouchEnd}
                      onClick={() => handleCellClick(day)}
                      className={`rounded-2xl shadow-sm border transition flex flex-col justify-between overflow-hidden cursor-pointer hover:brightness-110 ${cardBg} ${day.isToday && !isWorkoutMode ? "ring-2 ring-blue-500 border-blue-500" : ""}`}

                      <div className={`p-2.5 flex items-center justify-between ${headerBg}`}>
                        <div>
                          <div className="text-[11px] font-semibold opacity-90">{dayNames[day.dayOfWeek]}</div>
                          <div className={`text-base font-bold leading-none ${dateNumColor}`}>{day.dateStr.substring(5).replace('-', '.')}</div>
                        </div>
                        <div className="flex items-center space-x-1.5">
                          {day.hasWorkout && (
                            <div className="flex items-center space-x-1">
                              {day.workoutParsed.types.map(t => (
                                <span key={t} className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-amber-800 text-white shadow-xs">
                                  {t === 'running' ? '🏃 러닝' : '🏋️ 크로스핏'}

                              ))}
                            </div>
                          )}
                          {day.holidayName && (
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${day.isToday && !isWorkoutMode ? 'bg-red-500 text-white' : (isWorkoutMode ? 'bg-red-950 text-red-300 border border-red-800' : 'bg-red-100 text-red-600')}`}>{day.holidayName}</span>
                          )}
                        </div>
                      </div>
                      <div className="p-2.5 flex-1 flex flex-col justify-between space-y-2.5">
                        <div className={`flex items-center justify-between p-2 rounded-xl border transition ${shiftBoxStyle}`}>
                          <span className={`text-xs ${isWorkoutMode ? 'text-slate-200' : 'text-slate-600 font-medium'}`}>근무</span>
                          <span className={`text-xs font-bold ${isWorkoutMode ? 'text-white' : 'text-slate-800'}`}>{shift}</span>
                        </div>
                        
                        {!isWorkoutMode && (
                          <div className="space-y-1 flex-1 min-h-[70px]">
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">일정 ({day.dayEvents.length})</div>
                            {day.dayEvents.length > 0 ? (
                              day.dayEvents.map((evt) => (
                                <div key={evt.id} className="text-[11px] bg-emerald-50 hover:bg-emerald-100 text-emerald-900 p-1.5 rounded-lg border border-emerald-200/80 space-y-0.5 shadow-2xs">
                                  <div className="font-bold flex items-center justify-between">
                                    <span>{evt.title}</span>
                                    {evt.time && <span className="text-[9px] text-emerald-700 font-bold bg-white/80 px-1 py-0.2 rounded border border-emerald-200/60">{evt.time}</span>}
                                  </div>
                                  {evt.note && <div className="text-[9.5px] text-emerald-700/80 leading-tight">{evt.note}</div>}
                                </div>
                              ))
                            ) : (
                              <div className="text-[10px] text-slate-500 text-center py-4">일정 없음</div>
                            )}
                          </div>
                        )}

                        <button onClick={(e) => { e.stopPropagation(); setSelectedDateStr(day.dateStr); }} className={`w-full py-1.5 text-xs font-medium rounded-lg transition flex items-center justify-center space-x-1 ${isWorkoutMode ? 'bg-slate-800 hover:bg-slate-700 text-slate-200' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                          <i className="fa-solid fa-pen text-[10px]"></i><span>상세 수정</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        if (viewMode === 'yearly') {
          const y = targetDate.getFullYear();
          return (
            <div className={`rounded-2xl shadow-sm border p-4 sm:p-5 transition-colors ${isWorkoutMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-800'}`}>
              <div className="text-center mb-3">
                <h2 className={`text-base sm:text-lg font-bold ${isWorkoutMode ? 'text-white' : 'text-slate-800'}`}>{y}년 전체 달력 선택</h2>
                <p className="text-xs text-slate-400">원하는 월을 터치하여 해당 달로 이동하세요.</p>
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 sm:gap-3">
                {Array.from({ length: 12 }, (_, i) => i).map((m) => {
                  const isCurrentSelected = currDate.getFullYear() === y && currDate.getMonth() === m;
                  const isThisMonth = today.getFullYear() === y && today.getMonth() === m;
                  return (
                    <button key={m} onClick={() => { const newDate = new Date(targetDate); newDate.setMonth(m); setCurrentDate(newDate); setViewMode('monthly'); setDragX(0); }} className={`p-3 sm:p-4 rounded-2xl border transition flex flex-col items-center justify-center space-y-0.5 relative active:scale-95 ${isCurrentSelected ? 'bg-amber-600 text-white border-amber-600 shadow-md scale-105' : (isWorkoutMode ? 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700' : 'bg-slate-50 hover:bg-blue-50 text-slate-700 border-slate-200')}`}>
                      <span className="text-base sm:text-lg font-black">{m + 1}월</span>
                      {isThisMonth && (<span className={`text-[9px] font-bold px-1.5 py-0.2 rounded-full ${isCurrentSelected ? 'bg-white text-amber-700' : (isWorkoutMode ? 'bg-amber-950 text-amber-300' : 'bg-blue-100 text-blue-700')}`}>이번달</span>)}
                    </button>
                  );

              </div>
            </div>
          );
        }

      return (
        <div className="max-w-6xl mx-auto px-2 sm:px-4 py-3 sm:py-5">
          <div className={`rounded-2xl shadow-sm border p-3.5 sm:p-5 mb-2.5 transition-colors ${isWorkoutMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-800'}`}>
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div onClick={toggleYearlyView} className={`p-2 rounded-xl cursor-pointer transition active:scale-95 ${isWorkoutMode ? 'bg-slate-800 text-amber-400 hover:bg-slate-700' : 'bg-blue-50 hover:bg-blue-100 text-blue-600'}`} title="터치하여 12달 선택">
                  <i className="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div className="flex items-center space-x-3">
                  <div onTouchStart={handleHeaderTouchStart} onTouchEnd={handleHeaderTouchEnd} onMouseDown={handleHeaderTouchStart} onMouseUp={handleHeaderTouchEnd} onClick={handleHeaderClick} className="cursor-pointer group flex items-center space-x-1.5 hover:opacity-80 transition select-none" title="터치: 12달 보기 / 길게 누르기: 캡처 및 이미지 저장">
                    <h1 className={`text-lg sm:text-2xl font-bold tracking-tight ${isWorkoutMode ? 'text-white' : 'text-slate-800'}`}>
                      {viewMode === 'yearly' ? `${currDate.getFullYear()}년` : viewMode === 'monthly' ? `${currDate.getFullYear()}년 ${currDate.getMonth() + 1}월` : weekRangeText}
                    </h1>
                  </div>
                  <button onClick={goToday} className={`px-3 py-1 text-xs font-semibold rounded-lg transition active:scale-95 shadow-2xs ${isWorkoutMode ? 'bg-slate-800 text-amber-400 hover:bg-slate-700' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'}`}>오늘</button>
                </div>
              </div>
              <div className={`flex items-center justify-between md:justify-end space-x-2 border-t md:border-t-0 pt-2.5 md:pt-0 ${isWorkoutMode ? 'border-slate-800' : 'border-slate-100'}`}>
                <div className={`p-1 rounded-xl flex items-center text-xs font-bold ${isWorkoutMode ? 'bg-slate-800' : 'bg-slate-100'}`}>
                  <button onClick={() => { setViewMode('monthly'); setDragX(0); }} className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'monthly' ? (isWorkoutMode ? 'bg-slate-900 text-amber-400 shadow-sm' : 'bg-white text-blue-600 shadow-sm') : (isWorkoutMode ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-800')}`}>
                    <i className="fa-regular fa-calendar-days mr-1.5"></i>월간
                  </button>
                  <button onClick={() => { setViewMode('weekly'); setDragX(0); }} className={`px-3 py-1.5 rounded-lg transition ${viewMode === 'weekly' ? (isWorkoutMode ? 'bg-slate-900 text-amber-400 shadow-sm' : 'bg-white text-blue-600 shadow-sm') : (isWorkoutMode ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-800')}`}>
                    <i className="fa-solid fa-list-check mr-1.5"></i>위클리
                  </button>
                </div>
                <div className="flex items-center space-x-1.5">
                  <button onClick={() => setIsAuthModalOpen(true)} className={`flex items-center space-x-1 px-3 py-2 text-xs font-bold rounded-xl transition shadow-sm active:scale-95 ${user ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-blue-600 hover:bg-blue-700 text-white'}`}>
                    <i className="fa-solid fa-user"></i><span>{user ? `계정(${user})` : '로그인'}</span>
                  </button>
                  <button onClick={() => setIsSettingsOpen(true)} className={`flex items-center space-x-1.5 px-3 py-2 text-xs font-medium rounded-xl transition shadow-sm active:scale-95 ${isWorkoutMode ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}>
                    <i className="fa-solid fa-gear"></i><span className="hidden sm:inline">패턴 설정</span>
                  </button>
                </div>
              </div>
            </div>
            {viewMode === 'monthly' && (
              <div className={`mt-2 pt-2 border-t flex items-center space-x-2 text-xs font-semibold overflow-x-auto ${isWorkoutMode ? 'border-slate-800 text-slate-300' : 'border-slate-100 text-slate-600'}`}>
                <span className="text-slate-400 font-normal mr-1">이번달 근무:</span>
                <div className={`flex items-center space-x-1 px-2.5 py-0.5 rounded-full border ${isWorkoutMode ? 'bg-slate-800 text-blue-300 border-slate-700' : 'bg-blue-50 text-blue-700 border-blue-100'}`}><span className="w-2 h-2 rounded-full bg-blue-500"></span><span>당직 {monthSummary.당직}</span></div>
                <div className={`flex items-center space-x-1 px-2.5 py-0.5 rounded-full border ${isWorkoutMode ? 'bg-slate-800 text-amber-300 border-slate-700' : 'bg-amber-50 text-amber-800 border-amber-100'}`}><span className="w-2 h-2 rounded-full bg-amber-400"></span><span>주간 {monthSummary.주간}</span></div>
                <div className={`flex items-center space-x-1 px-2.5 py-0.5 rounded-full border ${isWorkoutMode ? 'bg-slate-800 text-rose-300 border-slate-700' : 'bg-rose-50 text-rose-700 border-rose-100'}`}><span className="w-2 h-2 rounded-full bg-rose-500"></span><span>비번 {monthSummary.비번}</span></div>
                {monthSummary.연차 > 0 && (<div className={`flex items-center space-x-1 px-2.5 py-0.5 rounded-full border ${isWorkoutMode ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-slate-100 text-slate-700 border-slate-200'}`}><span className="w-2 h-2 rounded-full bg-slate-500"></span><span>연차 {monthSummary.연차}</span></div>)}
              </div>
            )}
          </div>

          <div ref={containerRef} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} className="overflow-hidden w-full relative touch-pan-y">
            <div onTransitionEnd={handleTransitionEnd} style={{ display: 'flex', width: '300%', transform: `translateX(calc(-33.333333% + ${dragX}px))`, transition: isAnimating ? 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)' : 'none' }}>
              <div className="w-1/3 shrink-0 px-0.5">{renderViewContent(prevDate)}</div>
              <div className="w-1/3 shrink-0 px-0.5">{renderViewContent(currDate)}</div>
              <div className="w-1/3 shrink-0 px-0.5">{renderViewContent(nextDate)}</div>
            </div>
          </div>

          <div onClick={() => setIsWorkoutMode(!isWorkoutMode)} className={`mt-2 rounded-2xl p-2.5 sm:p-3 shadow-sm border flex flex-col sm:flex-row items-center justify-between gap-2 select-none cursor-pointer transition-all ${isWorkoutMode ? 'bg-slate-900 text-white border-slate-800 ring-2 ring-amber-500/50' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
            <div className="flex items-center space-x-2.5 w-full sm:w-auto">
              <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm shadow-xs shrink-0 ${isWorkoutMode ? 'bg-amber-600 text-white' : 'bg-[#1e3a8a] text-white'}`}>💪</div>
              <div>
                <div className={`text-xs font-bold flex items-center space-x-1.5 ${isWorkoutMode ? 'text-amber-200' : 'text-slate-800'}`}>
                  <span>이번 달 운동 통계 {isWorkoutMode ? '(운동 모드 켜짐 ✨)' : ''}</span>
                  <span className={`text-[10px] px-2 py-0.2 rounded-full font-bold ${isWorkoutMode ? 'bg-amber-950 text-amber-300' : 'text-blue-600 bg-blue-50'}`}>Total {monthSummary.총운동}회</span>
                </div>
                <div className={`text-[10px] ${isWorkoutMode ? 'text-slate-400' : 'text-slate-400'}`}>누르면 {isWorkoutMode ? '기본 근무 모드로 전환' : '운동 중심 월간 모드로 전환'}</div>
              </div>
            </div>
            <div className="flex items-center space-x-1.5 w-full sm:w-auto whitespace-nowrap">
              <div className={`flex items-center space-x-1 px-2 py-1.5 rounded-xl border text-xs font-bold flex-1 sm:flex-none justify-center ${isWorkoutMode ? 'bg-slate-800 text-amber-200 border-slate-700' : 'bg-blue-50/80 text-blue-900 border-blue-100'}`}><span>🏃 달리기</span><span className={`font-extrabold text-sm pl-0.5 ${isWorkoutMode ? 'text-white' : 'text-blue-600'}`}>{monthSummary.달리기}</span></div>
              <div className={`flex items-center space-x-1 px-2 py-1.5 rounded-xl border text-xs font-bold flex-[1.4] sm:flex-none justify-center ${isWorkoutMode ? 'bg-slate-800 text-amber-200 border-slate-700' : 'bg-indigo-50/80 text-indigo-900 border-indigo-100'}`}><span>🏋️ 크로스핏</span><span className={`font-extrabold text-sm pl-0.5 ${isWorkoutMode ? 'text-white' : 'text-indigo-600'}`}>{monthSummary.크로스핏}</span></div>
              <div className={`flex items-center space-x-1 px-2 py-1.5 rounded-xl text-xs font-bold shadow-xs flex-1 sm:flex-none justify-center ${isWorkoutMode ? 'bg-amber-950 text-amber-200' : 'bg-[#1e3a8a] text-white'}`}><span>총 운동</span><span className={`font-black text-sm pl-0.5 ${isWorkoutMode ? 'text-white' : 'text-blue-200'}`}>{monthSummary.총운동}</span></div>
            </div>
          </div>

          <div className="mt-2 mb-1 text-center select-none">
            <span className="text-[10.5px] font-semibold text-slate-400/80 bg-slate-200/50 px-3 py-0.5 rounded-full border border-slate-200/60">근무표 v2.9.2</span>
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 py-2.5 px-6 sm:hidden z-40 flex items-center justify-around shadow-lg">
            <button onClick={() => { setViewMode('monthly'); setDragX(0); }} className={`flex flex-col items-center space-y-1 ${viewMode === 'monthly' ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
              <i className="fa-regular fa-calendar-days text-base"></i><span className="text-[10px]">월간 달력</span>
            </button>
            <button onClick={() => { setViewMode('weekly'); setDragX(0); }} className={`flex flex-col items-center space-y-1 ${viewMode === 'weekly' ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
              <i className="fa-solid fa-list-check text-base"></i><span className="text-[10px]">위클리 스케줄</span>
            </button>
            <button onClick={() => setIsSettingsOpen(true)} className="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-700">
              <i className="fa-solid fa-gear text-base"></i><span className="text-[10px]">패턴 설정</span>
            </button>
          </div>

          {previewDayInfo && (
            <QuickPreviewPopup 
              dayInfo={previewDayInfo} 
              onClose={() => setPreviewDayInfo(null)} 
              onOpenDetail={() => { const target = previewDayInfo.dateStr; setPreviewDayInfo(null); setSelectedDateStr(target); }} 
              workoutParsed={parseWorkout(workouts[previewDayInfo.dateStr])}
              onSaveWorkout={(types, details) => updateWorkoutData(previewDayInfo.dateStr, types, details)}
            />
          )}

          {workoutPreviewDayInfo && (
            <WorkoutSummaryPopup 
              dayInfo={workoutPreviewDayInfo} 
              workoutParsed={parseWorkout(workouts[workoutPreviewDayInfo.dateStr])} 
              onOpenEdit={() => {
                setWorkoutPreviewDayInfo(null);
                setQuickWorkoutModalDay(workoutPreviewDayInfo);
              }}
              onClose={() => setWorkoutPreviewDayInfo(null)} 
            />
          )}

          {quickWorkoutModalDay && (
            <WorkoutOnlyModal 
              dateStr={quickWorkoutModalDay.dateStr} 
              workoutParsed={parseWorkout(workouts[quickWorkoutModalDay.dateStr])} 
              onSaveWorkout={(types, details) => updateWorkoutData(quickWorkoutModalDay.dateStr, types, details)} 
              onClose={() => setQuickWorkoutModalDay(null)} 
            />
          )}

          {selectedDateStr && (
            <DateDetailModal 
              dateStr={selectedDateStr} 
              onClose={() => setSelectedDateStr(null)} 
              settings={settings} 
              overrideShift={overrides[selectedDateStr]} 
              onSetOverride={(shift) => { if (shift === null) { const copy = { ...overrides }; delete copy[selectedDateStr]; setOverrides(copy); } else { setOverrides({ ...overrides, [selectedDateStr]: shift }); } }} 
              events={events[selectedDateStr] || []} 
              onAddEvent={(newEvent) => { const list = events[selectedDateStr] || []; setEvents({ ...events, [selectedDateStr]: [...list, newEvent] }); }} 
              onDeleteEvent={(eventId) => { const list = events[selectedDateStr] || []; setEvents({ ...events, [selectedDateStr]: list.filter((e) => e.id !== eventId) }); }} 
            />
          )}

          {isShareModalOpen && (<ShareCaptureModal currDate={currDate} monthlyDays={currMonthlyDays} monthSummary={monthSummary} isWorkoutMode={isWorkoutMode} onClose={() => setIsShareModalOpen(false)} />)}
          {isSettingsOpen && (<SettingsModal settings={settings} onSave={(newSettings) => { setSettings(newSettings); setIsSettingsOpen(false); }} onClose={() => setIsSettingsOpen(false)} />)}
          {isAuthModalOpen && (<AuthModal user={user} onLogin={(u) => { setUser(u); localStorage.setItem('shift_app_custom_user', u); setIsAuthModalOpen(false); }} onLogout={() => { setUser(null); localStorage.removeItem('shift_app_custom_user'); setIsAuthModalOpen(false); }} onClose={() => setIsAuthModalOpen(false)} />)}
        </div>
      );
    }

    function ShiftBadge({ info, isDarkBg }) {
      const { shift, isOverride } = info;
      if (shift === '당직') {
        return (
          <div className="relative group">
            <span className={`w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-[11px] sm:text-xs font-bold shadow-xs ${isDarkBg ? 'bg-blue-500 text-white ring-1 ring-white/40' : 'bg-blue-600 text-white'}`}>당</span>
            {isOverride && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 bg-amber-400 border border-white rounded-full" title="수동 수정됨"></span>}
          </div>
        );
      }
      if (shift === '주간') {
        return (
          <div className="relative group">
            <span className="w-6 h-6 sm:w-7 sm:h-7 bg-amber-400 text-slate-900 rounded-full flex items-center justify-center text-[11px] sm:text-xs font-bold shadow-xs">주</span>
            {isOverride && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 bg-blue-600 border border-white rounded-full" title="수동 수정됨"></span>}
          </div>
        );
      }
      if (shift === '비번') {
        return (
          <div className="relative group">
            <span className={`w-6 h-6 sm:w-7 sm:h-7 rounded-full flex items-center justify-center text-[11px] sm:text-xs font-bold shadow-xs border ${isDarkBg ? 'bg-rose-100 text-rose-800 border-rose-200' : 'bg-rose-50 text-rose-600 border-rose-200'}`}>비</span>
            {isOverride && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 bg-amber-400 border border-white rounded-full" title="수동 수정됨"></span>}
          </div>
        );
      }
      return <span className="w-6 h-6 sm:w-7 sm:h-7 bg-blue-600 text-white rounded-full flex items-center justify-center text-[11px] sm:text-xs font-bold shadow-xs">{shift.substring(0, 1)}</span>;
    }

    function ShareCaptureModal({ currDate, monthlyDays, monthSummary, isWorkoutMode, onClose }) {
      const [capturing, setCapturing] = useState(false);

                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">오늘의 근무 설정</label>
                <div className="bg-slate-50 rounded-xl p-2.5 mb-2.5 border border-slate-200/80 flex items-center justify-between text-xs">
                  <div><span className="text-slate-500">자동 스케줄: </span><span className="font-bold text-slate-800">{autoCalculated.shift}</span>{autoCalculated.isRuleModified && (<span className="text-red-500 font-medium ml-1">({autoCalculated.reason} 비번)</span>)}</div>
                  {isManual ? (<span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-md">수동 변경됨</span>) : (<span className="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-md">자동 적용중</span>)}
                </div>
                <div className="grid grid-cols-4 gap-1.5 sm:gap-2">
                  {['주간', '당직', '비번', '연차'].map((shiftOpt) => {
                    const isSelected = currentShift === shiftOpt;
                    return (
                      <button key={shiftOpt} onClick={() => onSetOverride(shiftOpt)} className={`py-2 px-2 rounded-xl text-xs font-bold border transition flex flex-col items-center justify-center space-y-0.5 ${isSelected ? "bg-slate-800 text-white border-slate-800 shadow-sm" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"}`}>
                        <span>{shiftOpt}</span>
                      </button>
                    );
                  })}
                </div>
                {isManual && (<button onClick={() => onSetOverride(null)} className="mt-2 text-xs text-blue-600 hover:underline font-medium flex items-center space-x-1"><i className="fa-solid fa-rotate-left text-[10px]"></i><span>기본 자동 스케줄로 복원</span></button>)}
              </div>
              <hr className="border-slate-100" />
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">개인 일정 ({events.length})</label>
                {events.length > 0 ? (
                  <div className="space-y-1.5 mb-3 max-h-32 overflow-y-auto custom-scrollbar">
                    {events.map((evt) => (
                      <div key={evt.id} className="p-2 bg-emerald-50/80 border border-emerald-200/80 rounded-xl flex items-center justify-between text-xs">
                        <div><div className="font-bold text-emerald-950">{evt.title}</div>{evt.time && <div className="text-emerald-700 font-semibold text-[10.5px]">{evt.time}</div>}{evt.note && <div className="text-emerald-800/80 text-[10.5px] mt-0.5">{evt.note}</div>}</div>
                        <button onClick={() => onDeleteEvent(evt.id)} className="text-slate-400 hover:text-red-500 p-1 transition" title="일정 삭제"><i className="fa-regular fa-trash-can"></i></button>
                      </div>
                    ))}
                  </div>
                ) : (<p className="text-xs text-slate-400 mb-3 text-center py-2 bg-slate-50 rounded-xl border border-dashed">등록된 일정이 없습니다.</p>)}
                <form onSubmit={handleAddEventSubmit} className="space-y-2 bg-slate-50/70 p-3 rounded-2xl border border-slate-200">
                  <div className="text-xs font-bold text-slate-700">새 일정 추가</div>
                  <div className="flex space-x-2">
                    <input type="text" placeholder="일정 제목" value={title} onChange={(e) => setTitle(e.target.value)} className="flex-1 px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required />
                    <input type="time" value={time} onChange={(e) => setTime(e.target.value)} className="w-24 px-2 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>
                  <input type="text" placeholder="메모 (선택사항)" value={note} onChange={(e) => setNote(e.target.value)} className="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" />
                  <button type="submit" className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition">일정 등록하기</button>
                </form>
              </div>
            </div>
            <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-end shrink-0">
              <button onClick={onClose} className="px-4 py-1.5 bg-slate-800 text-white text-xs font-semibold rounded-xl hover:bg-slate-900 transition">닫기</button>
            </div>
          </div>
        </div>
      );
    }

    function SettingsModal({ settings, onSave, onClose }) {
      const [anchorDate, setAnchorDate] = useState(settings.anchorDate);
      const [anchorShift, setAnchorShift] = useState(settings.anchorShift);

      const handleSubmit = (e) => { e.preventDefault(); onSave({ anchorDate, anchorShift }); };

      return (
        <div onClick={onClose} className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-3xl shadow-xl max-w-sm w-full overflow-hidden border border-slate-100">
            <div className="bg-slate-800 text-white px-5 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-2"><i className="fa-solid fa-sliders text-blue-400"></i><h3 className="text-base font-bold">스케줄 기준 패턴 설정</h3></div>
              <button onClick={onClose} className="p-1 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition"><i className="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4">
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-800 leading-relaxed">
                <p className="font-semibold mb-1">💡 교대 패턴 작동 규칙</p>
                <p>설정한 <strong>기준일</strong>의 근무부터 시작하여 <br /><span className="font-bold text-blue-900">주간 ➔ 당직 ➔ 비번</span> 순서로 3일 주기가 순환합니다.</p>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">스케줄 시작 기준일</label>
                <input type="date" value={anchorDate} onChange={(e) => setAnchorDate(e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-blue-500" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">기준일의 근무</label>
                <select value={anchorShift} onChange={(e) => setAnchorShift(e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                  <option value="당직">당직</option>
                  <option value="주간">주간</option>
                  <option value="비번">비번</option>
                </select>
              </div>
              <div className="pt-2 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 border border-slate-200 text-slate-600 text-xs font-semibold rounded-xl hover:bg-slate-50 transition">취소</button>
                <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl transition shadow-sm">설정 저장</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
